<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Top-down orthographic pixel-art diagram of a sedan with numbered hotspot photo capture markers">
  <rect width="1200" height="280" fill="#110022"/>

  <!-- Grid backdrop -->
  <g stroke="#330055" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200"/>
    <path d="M40 0 V280 M120 0 V280 M200 0 V280 M280 0 V280 M360 0 V280 M440 0 V280 M520 0 V280 M600 0 V280 M680 0 V280 M760 0 V280 M840 0 V280 M920 0 V280 M1000 0 V280 M1080 0 V280 M1160 0 V280"/>
  </g>

  <!-- Sedan top-down outline -->
  <g transform="translate(380,40)">
    <!-- main body -->
    <rect x="40" y="20" width="360" height="160" fill="none" stroke="#FF00CC" stroke-width="4"/>
    <!-- hood -->
    <path d="M40 80 L0 100 L0 120 L40 140" fill="none" stroke="#FF00CC" stroke-width="4"/>
    <!-- trunk -->
    <path d="M400 80 L440 100 L440 120 L400 140" fill="none" stroke="#FF00CC" stroke-width="4"/>
    <!-- roof outline -->
    <rect x="100" y="50" width="240" height="100" fill="none" stroke="#FF00CC" stroke-width="3" stroke-dasharray="6,4"/>
    <!-- windshield divider -->
    <line x1="100" y1="80" x2="340" y2="80" stroke="#FF00CC" stroke-width="2"/>
    <line x1="100" y1="120" x2="340" y2="120" stroke="#FF00CC" stroke-width="2"/>
    <!-- doors -->
    <line x1="220" y1="20" x2="220" y2="50" stroke="#FF00CC" stroke-width="2"/>
    <line x1="220" y1="150" x2="220" y2="180" stroke="#FF00CC" stroke-width="2"/>
    <!-- mirrors -->
    <rect x="86" y="14" width="14" height="6" fill="#FF00CC"/>
    <rect x="86" y="180" width="14" height="6" fill="#FF00CC"/>
    <!-- wheels -->
    <rect x="60" y="16" width="36" height="10" fill="#FF00CC"/>
    <rect x="344" y="16" width="36" height="10" fill="#FF00CC"/>
    <rect x="60" y="174" width="36" height="10" fill="#FF00CC"/>
    <rect x="344" y="174" width="36" height="10" fill="#FF00CC"/>
  </g>

  <!-- Hotspot markers -->
  <g font-family="VT323, monospace" font-weight="bold">
    <!-- Front 3/4 (front-left) -->
    <circle cx="350" cy="120" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="350" y="128" text-anchor="middle" font-size="20" fill="#110022">1</text>
    <text x="350" y="170" text-anchor="middle" font-size="14" fill="#00FF33">FRONT</text>

    <!-- Driver side -->
    <circle cx="540" cy="240" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="540" y="248" text-anchor="middle" font-size="20" fill="#110022">3</text>
    <text x="540" y="280" text-anchor="middle" font-size="14" fill="#00FF33">DRIVER</text>

    <!-- Passenger side -->
    <circle cx="700" cy="40" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="700" y="48" text-anchor="middle" font-size="20" fill="#110022">4</text>
    <text x="700" y="22" text-anchor="middle" font-size="14" fill="#00FF33">PASSENGER</text>

    <!-- Rear 3/4 -->
    <circle cx="900" cy="120" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="900" y="128" text-anchor="middle" font-size="20" fill="#110022">2</text>
    <text x="900" y="170" text-anchor="middle" font-size="14" fill="#00FF33">REAR</text>
  </g>

  <!-- Side labels -->
  <g font-family="VT323, monospace" fill="#FFFF00" font-size="14">
    <text x="40" y="40">SCAN: ALL FOUR CORNERS</text>
    <text x="1000" y="270">ORIENTATION: TOP-DOWN</text>
  </g>
</svg>
