<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="Pixel-art retro car with RESERVED placard and oversized key">
  <rect width="320" height="260" fill="#110022"/>
  <!-- Stars -->
  <g fill="#FFFF00">
    <rect x="10" y="20" width="2" height="2"/>
    <rect x="60" y="40" width="2" height="2"/>
    <rect x="110" y="14" width="2" height="2"/>
    <rect x="200" y="30" width="2" height="2"/>
    <rect x="260" y="60" width="2" height="2"/>
    <rect x="296" y="20" width="2" height="2"/>
  </g>

  <!-- Key big -->
  <g transform="translate(176,40)">
    <circle cx="30" cy="30" r="22" fill="none" stroke="#FFFF00" stroke-width="6"/>
    <circle cx="30" cy="30" r="8" fill="#110022"/>
    <rect x="50" y="26" width="80" height="8" fill="#FFFF00"/>
    <rect x="118" y="34" width="6" height="10" fill="#FFFF00"/>
    <rect x="128" y="34" width="6" height="10" fill="#FFFF00"/>
    <text x="40" y="78" font-family="VT323, monospace" font-size="18" fill="#00FF33" letter-spacing="2">CLAIMED!</text>
  </g>

  <!-- Car -->
  <g transform="translate(40,160)">
    <rect x="0" y="20" width="160" height="40" fill="#00CCFF"/>
    <rect x="20" y="0" width="120" height="24" fill="#00CCFF"/>
    <rect x="26" y="6" width="40" height="14" fill="#110022"/>
    <rect x="74" y="6" width="60" height="14" fill="#110022"/>
    <circle cx="30" cy="64" r="10" fill="#110022"/>
    <circle cx="30" cy="64" r="4" fill="#C0C0C0"/>
    <circle cx="130" cy="64" r="10" fill="#110022"/>
    <circle cx="130" cy="64" r="4" fill="#C0C0C0"/>
    <rect x="0" y="36" width="6" height="6" fill="#FFFF00"/>
    <rect x="154" y="36" width="6" height="6" fill="#FF3333"/>
  </g>

  <!-- RESERVED placard on windshield -->
  <g transform="translate(60,166) rotate(-6)">
    <rect width="80" height="22" fill="#FFFF00" stroke="#110022" stroke-width="2"/>
    <text x="40" y="16" font-family="VT323, monospace" font-size="16" fill="#110022" text-anchor="middle" font-weight="bold">RESERVED ★</text>
  </g>

  <!-- Confetti -->
  <g>
    <rect x="14" y="100" width="6" height="6" fill="#FF00CC" transform="rotate(20 17 103)"/>
    <rect x="50" y="80" width="6" height="6" fill="#00FF33" transform="rotate(45 53 83)"/>
    <rect x="100" y="60" width="6" height="6" fill="#FFFF00" transform="rotate(-10 103 63)"/>
    <rect x="160" y="120" width="6" height="6" fill="#00CCFF" transform="rotate(30 163 123)"/>
    <rect x="240" y="180" width="6" height="6" fill="#FF00CC" transform="rotate(-25 243 183)"/>
    <rect x="280" y="140" width="6" height="6" fill="#00FF33" transform="rotate(40 283 143)"/>
  </g>
</svg>
