<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" aria-label="Open envelope with chili pepper letter">
  <!-- Memphis squiggles -->
  <path d="M 16 40 Q 30 22 44 40 Q 58 58 72 40" stroke="#7B2FBE" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 280 30 Q 296 14 312 30" stroke="#FFD600" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Star burst -->
  <g transform="translate(40,260)">
    <polygon points="0,-16 4,-4 16,-4 6,4 10,16 0,8 -10,16 -6,4 -16,-4 -4,-4"
             fill="#FFD600" stroke="#1A1209" stroke-width="2.5"/>
  </g>
  <g transform="translate(320,260)">
    <polygon points="0,-14 4,-3 14,-3 5,4 9,14 0,7 -9,14 -5,4 -14,-3 -4,-3"
             fill="#FF85A1" stroke="#1A1209" stroke-width="2.5"/>
  </g>

  <!-- Envelope body -->
  <rect x="60" y="120" width="240" height="160" rx="6" fill="#FFF5E1" stroke="#1A1209" stroke-width="5"/>
  <!-- Envelope flap (open) -->
  <path d="M 60 120 L 180 90 L 300 120 L 180 60 Z" fill="#FFD600" stroke="#1A1209" stroke-width="5"/>
  <!-- Letter (chili sticking up) -->
  <rect x="120" y="60" width="120" height="80" fill="#FFF5E1" stroke="#1A1209" stroke-width="4"/>
  <!-- Chili coming out of envelope -->
  <g transform="translate(180,40)">
    <rect x="-3" y="-30" width="6" height="20" fill="#1D7A3A" stroke="#1A1209" stroke-width="2.5"/>
    <path d="M -2 -8 Q -28 0 -22 30 Q -16 50 0 50 Q 16 50 22 30 Q 28 0 2 -8 Z" fill="#FF4D38" stroke="#1A1209" stroke-width="4"/>
    <circle cx="-6" cy="14" r="3" fill="#1A1209"/>
    <circle cx="6" cy="14" r="3" fill="#1A1209"/>
    <path d="M -6 26 Q 0 32 6 26" stroke="#1A1209" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Envelope bottom triangles -->
  <path d="M 60 280 L 180 200 L 300 280 Z" fill="#FFD600" stroke="#1A1209" stroke-width="5"/>
  <path d="M 60 120 L 180 200 L 60 280" stroke="#1A1209" stroke-width="5" fill="none"/>
  <path d="M 300 120 L 180 200 L 300 280" stroke="#1A1209" stroke-width="5" fill="none"/>

  <!-- Dots -->
  <circle cx="260" cy="200" r="5" fill="#FF85A1"/>
  <circle cx="100" cy="240" r="5" fill="#FF85A1"/>
  <circle cx="220" cy="240" r="5" fill="#FF85A1"/>
</svg>
