<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="market" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#1C2333"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#market)"/>
  <!-- Market square stone -->
  <rect x="0" y="180" width="400" height="100" fill="#94A3B8" opacity="0.85"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="220" x2="400" y2="220"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="50" y1="180" x2="50" y2="280"/>
    <line x1="100" y1="180" x2="100" y2="280"/>
    <line x1="150" y1="180" x2="150" y2="280"/>
    <line x1="200" y1="180" x2="200" y2="280"/>
    <line x1="250" y1="180" x2="250" y2="280"/>
    <line x1="300" y1="180" x2="300" y2="280"/>
    <line x1="350" y1="180" x2="350" y2="280"/>
  </g>
  <!-- Background buildings -->
  <rect x="0" y="80" width="60" height="100" fill="#1C2333"/>
  <rect x="60" y="60" width="50" height="120" fill="#2a3140"/>
  <rect x="110" y="90" width="60" height="90" fill="#1C2333"/>
  <rect x="170" y="50" width="70" height="130" fill="#2a3140"/>
  <rect x="240" y="80" width="50" height="100" fill="#1C2333"/>
  <rect x="290" y="60" width="60" height="120" fill="#2a3140"/>
  <rect x="350" y="80" width="50" height="100" fill="#1C2333"/>
  <!-- Building windows -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="10" y="100" width="6" height="8"/>
    <rect x="22" y="100" width="6" height="8"/>
    <rect x="34" y="100" width="6" height="8"/>
    <rect x="46" y="100" width="6" height="8"/>
    <rect x="10" y="120" width="6" height="8"/>
    <rect x="22" y="120" width="6" height="8"/>
    <rect x="180" y="80" width="6" height="8"/>
    <rect x="195" y="80" width="6" height="8"/>
    <rect x="210" y="80" width="6" height="8"/>
    <rect x="180" y="100" width="6" height="8"/>
    <rect x="195" y="100" width="6" height="8"/>
    <rect x="210" y="100" width="6" height="8"/>
    <rect x="300" y="80" width="6" height="8"/>
    <rect x="315" y="80" width="6" height="8"/>
    <rect x="330" y="80" width="6" height="8"/>
  </g>
  <!-- Market stalls (striped roofs) -->
  <g>
    <rect x="60" y="155" width="60" height="30" fill="#D97706"/>
    <rect x="60" y="155" width="60" height="6" fill="#FFFFFF"/>
    <rect x="60" y="167" width="60" height="6" fill="#FFFFFF"/>
    <rect x="160" y="160" width="60" height="25" fill="#0d9488"/>
    <rect x="160" y="160" width="60" height="5" fill="#FFFFFF"/>
    <rect x="160" y="171" width="60" height="5" fill="#FFFFFF"/>
    <rect x="240" y="155" width="60" height="30" fill="#2563EB"/>
    <rect x="240" y="155" width="60" height="6" fill="#FFFFFF"/>
    <rect x="240" y="167" width="60" height="6" fill="#FFFFFF"/>
  </g>
  <!-- People dots -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="80" cy="220" r="2.5"/>
    <circle cx="105" cy="225" r="2.5"/>
    <circle cx="135" cy="218" r="2.5"/>
    <circle cx="165" cy="228" r="2.5"/>
    <circle cx="195" cy="220" r="2.5"/>
    <circle cx="225" cy="225" r="2.5"/>
    <circle cx="265" cy="218" r="2.5"/>
    <circle cx="295" cy="228" r="2.5"/>
    <circle cx="325" cy="220" r="2.5"/>
  </g>
</svg>
