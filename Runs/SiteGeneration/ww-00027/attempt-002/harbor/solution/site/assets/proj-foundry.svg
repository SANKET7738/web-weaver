<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="industrial" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2a1f"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#industrial)"/>
  <!-- Brick texture pattern with rust -->
  <g opacity="0.22">
    <rect x="0" y="120" width="400" height="160" fill="#7c3a1a"/>
  </g>
  <!-- Old factory structures -->
  <rect x="20" y="50" width="80" height="170" fill="#2a1f17"/>
  <rect x="20" y="50" width="80" height="170" fill="none" stroke="#D97706" stroke-width="0.5" opacity="0.4"/>
  <!-- Smokestack -->
  <rect x="50" y="20" width="14" height="40" fill="#1a1208"/>
  <!-- Windows grid on building -->
  <g fill="#D97706" opacity="0.6">
    <rect x="30" y="70" width="10" height="14"/>
    <rect x="48" y="70" width="10" height="14"/>
    <rect x="66" y="70" width="10" height="14"/>
    <rect x="84" y="70" width="10" height="14"/>
    <rect x="30" y="100" width="10" height="14"/>
    <rect x="48" y="100" width="10" height="14"/>
    <rect x="66" y="100" width="10" height="14"/>
    <rect x="84" y="100" width="10" height="14"/>
    <rect x="30" y="130" width="10" height="14"/>
    <rect x="48" y="130" width="10" height="14"/>
    <rect x="66" y="130" width="10" height="14"/>
    <rect x="84" y="130" width="10" height="14"/>
  </g>
  <!-- Civic square pavement -->
  <rect x="120" y="170" width="270" height="100" fill="#94A3B8" opacity="0.85"/>
  <g stroke="#334155" stroke-width="0.5" opacity="0.5">
    <line x1="120" y1="200" x2="390" y2="200"/>
    <line x1="120" y1="230" x2="390" y2="230"/>
    <line x1="120" y1="260" x2="390" y2="260"/>
    <line x1="180" y1="170" x2="180" y2="270"/>
    <line x1="240" y1="170" x2="240" y2="270"/>
    <line x1="300" y1="170" x2="300" y2="270"/>
    <line x1="360" y1="170" x2="360" y2="270"/>
  </g>
  <!-- Adapted reuse modern intervention -->
  <rect x="200" y="80" width="180" height="90" fill="#1C2333" opacity="0.95"/>
  <rect x="200" y="80" width="180" height="90" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="290" y1="80" x2="290" y2="170" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <line x1="200" y1="125" x2="380" y2="125" stroke="#2563EB" stroke-width="1" opacity="0.6"/>
  <!-- Civic data points -->
  <circle cx="160" cy="220" r="3" fill="#0d9488"/>
  <circle cx="220" cy="240" r="3" fill="#0d9488"/>
  <circle cx="280" cy="220" r="3" fill="#0d9488"/>
  <circle cx="340" cy="245" r="3" fill="#0d9488"/>
</svg>
