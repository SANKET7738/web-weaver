<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#sunset)"/>
  <!-- Sun -->
  <circle cx="320" cy="80" r="40" fill="#fde68a" opacity="0.85"/>
  <!-- Solar rays -->
  <g stroke="#fde68a" stroke-width="0.8" opacity="0.55">
    <line x1="320" y1="20" x2="320" y2="60"/>
    <line x1="380" y1="80" x2="370" y2="80"/>
    <line x1="280" y1="40" x2="290" y2="50"/>
    <line x1="370" y1="40" x2="360" y2="50"/>
    <line x1="280" y1="120" x2="290" y2="110"/>
    <line x1="370" y1="120" x2="360" y2="110"/>
  </g>
  <!-- Promenade ground -->
  <rect x="0" y="180" width="400" height="100" fill="#cbd5e1"/>
  <rect x="0" y="180" width="400" height="100" fill="#92400e" opacity="0.18"/>
  <!-- Long shadow lines from columns -->
  <g opacity="0.4">
    <polygon points="100,180 120,180 200,280 180,280" fill="#1C2333"/>
    <polygon points="180,180 200,180 280,280 260,280" fill="#1C2333"/>
    <polygon points="260,180 280,180 360,280 340,280" fill="#1C2333"/>
  </g>
  <!-- Columns / tree trunks (palms) -->
  <rect x="100" y="80" width="6" height="100" fill="#451a03"/>
  <rect x="180" y="80" width="6" height="100" fill="#451a03"/>
  <rect x="260" y="80" width="6" height="100" fill="#451a03"/>
  <!-- Palm canopies -->
  <g fill="#0d9488" opacity="0.85">
    <ellipse cx="103" cy="80" rx="32" ry="14"/>
    <ellipse cx="183" cy="80" rx="36" ry="14"/>
    <ellipse cx="263" cy="80" rx="32" ry="14"/>
  </g>
  <!-- Pavement seams -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="50" y1="180" x2="50" y2="280"/>
    <line x1="130" y1="180" x2="130" y2="280"/>
    <line x1="220" y1="180" x2="220" y2="280"/>
    <line x1="320" y1="180" x2="320" y2="280"/>
  </g>
  <!-- People silhouettes -->
  <g fill="#1C2333" opacity="0.7">
    <circle cx="60" cy="200" r="3"/>
    <rect x="58" y="203" width="4" height="10"/>
    <circle cx="160" cy="220" r="3"/>
    <rect x="158" y="223" width="4" height="10"/>
    <circle cx="240" cy="210" r="3"/>
    <rect x="238" y="213" width="4" height="10"/>
  </g>
</svg>
