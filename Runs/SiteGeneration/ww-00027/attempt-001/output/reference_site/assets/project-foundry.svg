<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Foundry Commons civic square diagram">
  <defs>
    <pattern id="f-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#1C2333"/>
  <rect width="400" height="280" fill="url(#f-grid)"/>
  <!-- old industrial silhouette -->
  <g fill="#334155" opacity="0.85">
    <rect x="40" y="120" width="50" height="80"/>
    <rect x="100" y="100" width="40" height="100"/>
    <rect x="150" y="80" width="30" height="120"/>
    <polygon points="115,100 120,80 140,80 145,100"/>
    <rect x="190" y="110" width="60" height="90"/>
    <rect x="260" y="90" width="35" height="110"/>
    <rect x="305" y="105" width="45" height="95"/>
  </g>
  <!-- chimney -->
  <rect x="160" y="40" width="8" height="40" fill="#334155"/>
  <!-- repurposed plaza -->
  <rect x="50" y="200" width="300" height="40" fill="#F0F2F5" opacity="0.92"/>
  <rect x="50" y="200" width="300" height="40" fill="none" stroke="#2563EB" stroke-width="1.5"/>
  <!-- plaza grid -->
  <g stroke="#94A3B8" stroke-width="0.5" opacity="0.6">
    <path d="M110 200V240"/><path d="M170 200V240"/><path d="M230 200V240"/><path d="M290 200V240"/>
    <path d="M50 220H350"/>
  </g>
  <!-- sentiment dots -->
  <g>
    <circle cx="80" cy="220" r="3" fill="#0D9488"/>
    <circle cx="140" cy="220" r="4" fill="#0D9488"/>
    <circle cx="200" cy="220" r="5" fill="#D97706"/>
    <circle cx="260" cy="220" r="4" fill="#0D9488"/>
    <circle cx="320" cy="220" r="3" fill="#0D9488"/>
  </g>
  <!-- KPI -->
  <text x="20" y="30" font-family="IBM Plex Mono, monospace" font-size="10" fill="#D97706" letter-spacing="0.16em">DETROIT · ADAPTIVE REUSE · 6,800 m²</text>
  <text x="20" y="265" font-family="IBM Plex Mono, monospace" font-size="9" fill="#94A3B8" letter-spacing="0.14em">3,400 SURVEY RESPONDENTS</text>
</svg>
