<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aerial diagram of Meridian Plaza waterfront">
  <defs>
    <linearGradient id="m-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0f3a4a"/>
    </linearGradient>
    <pattern id="m-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="400" height="280" fill="#1C2333"/>
  <rect width="400" height="280" fill="url(#m-grid)"/>
  <!-- water -->
  <path d="M0 180 L400 150 L400 280 L0 280 Z" fill="url(#m-water)" opacity="0.85"/>
  <path d="M0 200 L400 175" stroke="#0D9488" stroke-width="0.5" opacity="0.4"/>
  <path d="M0 220 L400 195" stroke="#0D9488" stroke-width="0.5" opacity="0.3"/>
  <!-- plaza -->
  <rect x="60" y="60" width="280" height="120" fill="#F0F2F5" opacity="0.92"/>
  <rect x="60" y="60" width="280" height="120" fill="none" stroke="#2563EB" stroke-width="2"/>
  <!-- internal grid -->
  <g stroke="#94A3B8" stroke-width="0.5" opacity="0.7">
    <path d="M130 60V180"/>
    <path d="M200 60V180"/>
    <path d="M270 60V180"/>
    <path d="M60 100H340"/>
    <path d="M60 140H340"/>
  </g>
  <!-- pedestrian heat dots -->
  <g fill="#D97706">
    <circle cx="100" cy="90" r="3"/>
    <circle cx="160" cy="120" r="5" opacity="0.85"/>
    <circle cx="220" cy="100" r="4"/>
    <circle cx="280" cy="135" r="6" opacity="0.9"/>
    <circle cx="180" cy="160" r="3"/>
    <circle cx="240" cy="160" r="3"/>
    <circle cx="120" cy="155" r="2"/>
    <circle cx="310" cy="105" r="3"/>
  </g>
  <!-- KPI marker -->
  <text x="60" y="45" font-family="IBM Plex Mono, monospace" font-size="10" fill="#D97706" letter-spacing="0.16em">N ↑ ROTTERDAM · 4,200 m²</text>
  <!-- corner ticks -->
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M55 60H60V65"/>
    <path d="M340 60V65H345" transform="translate(-5,0)"/>
    <path d="M60 175V180H65" transform="translate(-5,5)"/>
    <path d="M340 180H345V175" transform="translate(-5,5)"/>
  </g>
</svg>
