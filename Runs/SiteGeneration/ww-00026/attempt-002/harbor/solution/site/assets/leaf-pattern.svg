<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <g fill="#2D3A35" fill-opacity="1">
    <!-- Sprig 1 -->
    <g transform="translate(20 20) rotate(20)">
      <path d="M0 0 L 0 30" stroke="#2D3A35" stroke-width="1.5" fill="none"/>
      <ellipse cx="-5" cy="6" rx="6" ry="3"/>
      <ellipse cx="5" cy="14" rx="6" ry="3"/>
      <ellipse cx="-5" cy="22" rx="6" ry="3"/>
    </g>
    <!-- Sprig 2 -->
    <g transform="translate(95 35) rotate(-30)">
      <path d="M0 0 L 0 28" stroke="#2D3A35" stroke-width="1.5" fill="none"/>
      <ellipse cx="-5" cy="8" rx="5" ry="2.5"/>
      <ellipse cx="5" cy="18" rx="5" ry="2.5"/>
    </g>
    <!-- Dot cluster 1 -->
    <circle cx="55" cy="65" r="2"/>
    <circle cx="62" cy="68" r="2"/>
    <circle cx="58" cy="74" r="2"/>
    <!-- Sprig 3 -->
    <g transform="translate(30 90) rotate(60)">
      <path d="M0 0 L 0 26" stroke="#2D3A35" stroke-width="1.5" fill="none"/>
      <ellipse cx="-4" cy="6" rx="5" ry="2.5"/>
      <ellipse cx="4" cy="14" rx="5" ry="2.5"/>
      <ellipse cx="-4" cy="22" rx="5" ry="2.5"/>
    </g>
    <!-- Dot cluster 2 -->
    <circle cx="100" cy="100" r="2"/>
    <circle cx="108" cy="105" r="2"/>
    <circle cx="103" cy="110" r="2"/>
    <!-- Single dot accents -->
    <circle cx="80" cy="20" r="1.5"/>
    <circle cx="20" cy="60" r="1.5"/>
    <circle cx="125" cy="75" r="1.5"/>
  </g>
</svg>
