<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" role="img" aria-label="Open envelope with a bloom flower emerging">
  <!-- Envelope base -->
  <g>
    <rect x="40" y="120" width="280" height="170" rx="14" fill="#FFF8F4" stroke="#2D3A35" stroke-width="3"/>
    <!-- Envelope flap -->
    <path d="M40 120 L180 200 L320 120" fill="none" stroke="#2D3A35" stroke-width="3"/>
    <!-- Stationery card sticking out -->
    <rect x="80" y="80" width="200" height="140" rx="6" fill="#FFCBA4" stroke="#2D3A35" stroke-width="3"/>
    <line x1="100" y1="120" x2="220" y2="120" stroke="#2D3A35" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="140" x2="200" y2="140" stroke="#2D3A35" stroke-width="2" opacity="0.4"/>
    <line x1="100" y1="160" x2="240" y2="160" stroke="#2D3A35" stroke-width="2" opacity="0.4"/>

    <!-- Stem -->
    <path d="M180 80 L 180 30" stroke="#2D3A35" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M180 60 C 165 50, 150 56, 152 70 C 168 68, 178 64, 180 60 Z" fill="#A8E6CF" stroke="#2D3A35" stroke-width="2"/>
    <path d="M180 50 C 195 40, 210 46, 208 60 C 192 58, 182 54, 180 50 Z" fill="#A8E6CF" stroke="#2D3A35" stroke-width="2"/>

    <!-- Flower head -->
    <g transform="translate(180 25)">
      <ellipse cx="0" cy="-20" rx="11" ry="17" fill="#FF6F5E" stroke="#2D3A35" stroke-width="2"/>
      <ellipse cx="19" cy="-10" rx="11" ry="17" fill="#FF8B7A" transform="rotate(60 19 -10)" stroke="#2D3A35" stroke-width="2"/>
      <ellipse cx="19" cy="10" rx="11" ry="17" fill="#FF6F5E" transform="rotate(120 19 10)" stroke="#2D3A35" stroke-width="2"/>
      <ellipse cx="0" cy="20" rx="11" ry="17" fill="#FF8B7A" stroke="#2D3A35" stroke-width="2"/>
      <ellipse cx="-19" cy="10" rx="11" ry="17" fill="#FF6F5E" transform="rotate(60 -19 10)" stroke="#2D3A35" stroke-width="2"/>
      <ellipse cx="-19" cy="-10" rx="11" ry="17" fill="#FF8B7A" transform="rotate(120 -19 -10)" stroke="#2D3A35" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#FFE566" stroke="#2D3A35" stroke-width="2"/>
    </g>

    <!-- Heart on envelope (small) -->
    <path d="M170 250 C 158 238, 138 248, 158 270 C 178 290, 198 270, 198 258 C 198 248, 178 238, 170 250 Z"
          fill="#FF6F5E" stroke="#2D3A35" stroke-width="2"/>
  </g>
</svg>
