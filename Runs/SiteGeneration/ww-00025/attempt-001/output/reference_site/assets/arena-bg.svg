<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A0F"/>
      <stop offset="1" stop-color="#7B00FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="pylonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF0080" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#7B00FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0A0A0F" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridFloor" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse" patternTransform="skewY(-12)">
      <path d="M 0 0 L 80 0 M 0 0 L 0 40" stroke="#00F5FF" stroke-width="0.6" fill="none" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1440" height="600" fill="url(#skyFade)"/>

  <!-- distant city skyline -->
  <g opacity="0.35">
    <rect x="20" y="280" width="80" height="180" fill="#1C1C2E"/>
    <rect x="120" y="240" width="60" height="220" fill="#1C1C2E"/>
    <rect x="200" y="220" width="100" height="240" fill="#1C1C2E"/>
    <rect x="320" y="260" width="50" height="200" fill="#1C1C2E"/>
    <rect x="390" y="200" width="80" height="260" fill="#1C1C2E"/>
    <rect x="490" y="280" width="40" height="180" fill="#1C1C2E"/>
    <rect x="550" y="220" width="100" height="240" fill="#1C1C2E"/>
    <rect x="670" y="260" width="60" height="200" fill="#1C1C2E"/>
    <rect x="750" y="180" width="120" height="280" fill="#1C1C2E"/>
    <rect x="890" y="240" width="60" height="220" fill="#1C1C2E"/>
    <rect x="970" y="220" width="80" height="240" fill="#1C1C2E"/>
    <rect x="1070" y="260" width="50" height="200" fill="#1C1C2E"/>
    <rect x="1140" y="200" width="100" height="260" fill="#1C1C2E"/>
    <rect x="1260" y="240" width="60" height="220" fill="#1C1C2E"/>
    <rect x="1340" y="280" width="80" height="180" fill="#1C1C2E"/>
  </g>

  <!-- skyline window dots -->
  <g fill="#00F5FF" opacity="0.7">
    <rect x="40" y="320" width="3" height="3"/>
    <rect x="60" y="350" width="3" height="3"/>
    <rect x="140" y="280" width="3" height="3"/>
    <rect x="160" y="310" width="3" height="3"/>
    <rect x="240" y="270" width="3" height="3"/>
    <rect x="270" y="320" width="3" height="3"/>
    <rect x="410" y="240" width="3" height="3"/>
    <rect x="440" y="280" width="3" height="3"/>
    <rect x="580" y="260" width="3" height="3"/>
    <rect x="610" y="300" width="3" height="3"/>
    <rect x="780" y="220" width="3" height="3"/>
    <rect x="810" y="270" width="3" height="3"/>
    <rect x="840" y="320" width="3" height="3"/>
    <rect x="990" y="260" width="3" height="3"/>
    <rect x="1020" y="310" width="3" height="3"/>
    <rect x="1170" y="240" width="3" height="3"/>
    <rect x="1200" y="290" width="3" height="3"/>
    <rect x="1280" y="280" width="3" height="3"/>
  </g>

  <!-- distant tall pylons -->
  <g>
    <rect x="220" y="40" width="6" height="380" fill="url(#pylonGlow)"/>
    <rect x="650" y="20" width="6" height="400" fill="url(#pylonGlow)"/>
    <rect x="1080" y="60" width="6" height="360" fill="url(#pylonGlow)"/>
    <rect x="1300" y="40" width="6" height="380" fill="url(#pylonGlow)"/>
  </g>

  <!-- arena dome silhouette -->
  <path d="M 360 460 Q 720 200 1080 460 Z" fill="#0A0A0F" opacity="0.85"/>
  <path d="M 360 460 Q 720 200 1080 460" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 420 440 Q 720 240 1020 440" fill="none" stroke="#FF0080" stroke-width="0.8" opacity="0.45"/>
  <path d="M 480 420 Q 720 280 960 420" fill="none" stroke="#FF0080" stroke-width="0.6" opacity="0.4"/>

  <!-- arena central spire -->
  <rect x="715" y="200" width="10" height="80" fill="#00F5FF" opacity="0.8"/>
  <circle cx="720" cy="200" r="8" fill="#FF0080"/>
  <circle cx="720" cy="200" r="14" fill="none" stroke="#FF0080" stroke-width="1" opacity="0.6"/>

  <!-- grid floor -->
  <rect x="0" y="460" width="1440" height="140" fill="url(#gridFloor)"/>

  <!-- horizon glow -->
  <rect x="0" y="450" width="1440" height="2" fill="#00F5FF" opacity="0.7"/>
  <rect x="0" y="447" width="1440" height="6" fill="#00F5FF" opacity="0.2"/>

  <!-- foreground neon lane lines -->
  <g stroke="#FF0080" stroke-width="2" opacity="0.7">
    <line x1="200" y1="600" x2="500" y2="460"/>
    <line x1="1240" y1="600" x2="940" y2="460"/>
  </g>
  <g stroke="#00F5FF" stroke-width="1" opacity="0.4">
    <line x1="400" y1="600" x2="600" y2="460"/>
    <line x1="1040" y1="600" x2="840" y2="460"/>
  </g>
</svg>
