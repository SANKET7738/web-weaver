<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Illustrated map of Clearmind Therapy office and surroundings">
  <rect width="480" height="360" fill="#E8EEF4"/>
  <!-- Streets -->
  <rect x="0" y="160" width="480" height="40" fill="#FFFFFF"/>
  <rect x="200" y="0" width="40" height="360" fill="#FFFFFF"/>
  <rect x="0" y="80" width="480" height="14" fill="#FFFFFF" opacity="0.7"/>
  <rect x="0" y="280" width="480" height="14" fill="#FFFFFF" opacity="0.7"/>
  <rect x="80" y="0" width="14" height="360" fill="#FFFFFF" opacity="0.7"/>
  <rect x="380" y="0" width="14" height="360" fill="#FFFFFF" opacity="0.7"/>

  <!-- Street labels -->
  <text x="220" y="156" font-family="DM Sans, sans-serif" font-size="9" fill="#6B7A8F" letter-spacing="1.2">MERIDIAN AVE</text>
  <text x="380" y="216" font-family="DM Sans, sans-serif" font-size="9" fill="#6B7A8F" letter-spacing="1.2" transform="rotate(-90 380 216)">CENTRAL ST</text>

  <!-- Buildings -->
  <rect x="20" y="20" width="50" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="100" y="20" width="92" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="248" y="20" width="120" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="400" y="20" width="64" height="50" rx="4" fill="#FFFFFF"/>

  <rect x="20" y="100" width="50" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="100" y="100" width="92" height="50" rx="4" fill="#FFFFFF"/>
  <rect x="248" y="100" width="120" height="50" rx="4" fill="#D6F0E8" stroke="#4AAE8C" stroke-width="2"/>
  <rect x="400" y="100" width="64" height="50" rx="4" fill="#FFFFFF"/>

  <rect x="20" y="210" width="50" height="60" rx="4" fill="#FFFFFF"/>
  <rect x="100" y="210" width="92" height="60" rx="4" fill="#FFFFFF"/>
  <rect x="248" y="210" width="120" height="60" rx="4" fill="#FFFFFF"/>
  <rect x="400" y="210" width="64" height="60" rx="4" fill="#FFFFFF"/>

  <rect x="20" y="300" width="50" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="100" y="300" width="92" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="248" y="300" width="120" height="44" rx="4" fill="#FFFFFF"/>
  <rect x="400" y="300" width="64" height="44" rx="4" fill="#FFFFFF"/>

  <!-- Park -->
  <rect x="20" y="100" width="50" height="50" rx="4" fill="#D6F0E8"/>
  <circle cx="32" cy="120" r="6" fill="#4AAE8C" opacity="0.7"/>
  <circle cx="50" cy="132" r="6" fill="#4AAE8C" opacity="0.7"/>
  <circle cx="60" cy="116" r="5" fill="#4AAE8C" opacity="0.7"/>

  <!-- Office pin -->
  <circle cx="308" cy="125" r="14" fill="#4AAE8C"/>
  <circle cx="308" cy="125" r="6" fill="#FFFFFF"/>
  <text x="265" y="92" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#1A2332">CLEARMIND THERAPY</text>

  <!-- Metro stop -->
  <circle cx="120" cy="180" r="10" fill="#4AAE8C"/>
  <text x="118" y="184" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="100" y="158" font-family="DM Sans, sans-serif" font-size="9" fill="#6B7A8F">Central Station</text>

  <!-- Parking marker -->
  <rect x="412" y="118" width="22" height="22" rx="4" fill="#6B7A8F"/>
  <text x="423" y="134" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
  <text x="408" y="156" font-family="DM Sans, sans-serif" font-size="9" fill="#6B7A8F">Garage</text>

  <!-- Compass -->
  <g transform="translate(440 320)">
    <circle r="14" fill="#FFFFFF" stroke="#E8EEF4" stroke-width="1"/>
    <path d="M0 -10 L4 0 L0 10 L-4 0 Z" fill="#4AAE8C"/>
    <text x="0" y="-2" font-family="DM Sans, sans-serif" font-size="7" font-weight="700" fill="#1A2332" text-anchor="middle">N</text>
  </g>
</svg>
