<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE600"/>
      <stop offset="1" stop-color="#FF5C00"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#FF1F8E"/>
    </linearGradient>
  </defs>
  <!-- radiating energy lines -->
  <g stroke="#FFE600" stroke-width="3" opacity="0.7">
    <line x1="280" y1="20" x2="280" y2="80"/>
    <line x1="120" y1="50" x2="160" y2="100"/>
    <line x1="440" y1="50" x2="400" y2="100"/>
    <line x1="60"  y1="180" x2="120" y2="200"/>
    <line x1="500" y1="180" x2="440" y2="200"/>
    <line x1="40"  y1="320" x2="100" y2="320"/>
    <line x1="520" y1="320" x2="460" y2="320"/>
    <line x1="70"  y1="440" x2="120" y2="420"/>
    <line x1="490" y1="440" x2="440" y2="420"/>
  </g>
  <g stroke="#FF1F8E" stroke-width="3" opacity="0.6">
    <line x1="180" y1="20" x2="200" y2="60"/>
    <line x1="380" y1="20" x2="360" y2="60"/>
    <line x1="20" y1="240" x2="80" y2="250"/>
    <line x1="540" y1="240" x2="480" y2="250"/>
  </g>
  <!-- antenna -->
  <path d="M280 50 L280 110 L270 130 L290 130 Z" fill="#FF1F8E"/>
  <circle cx="280" cy="46" r="14" fill="#FFE600" stroke="#0D0D0D" stroke-width="4"/>
  <!-- bolt accent above antenna -->
  <path d="M275 18 L268 30 L275 32 L272 44 L284 28 L277 26 Z" fill="#FF5C00"/>
  <!-- head -->
  <rect x="180" y="120" width="200" height="160" rx="14" fill="url(#bodyGrad)" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="170" y="140" width="20" height="80" rx="4" fill="#0D0D0D"/>
  <rect x="370" y="140" width="20" height="80" rx="4" fill="#0D0D0D"/>
  <!-- visor -->
  <rect x="200" y="160" width="160" height="70" rx="6" fill="#0D0D0D"/>
  <rect x="208" y="168" width="144" height="54" rx="4" fill="url(#visorGrad)"/>
  <!-- eyes -->
  <circle cx="240" cy="195" r="14" fill="#FFE600" stroke="#0D0D0D" stroke-width="3"/>
  <circle cx="320" cy="195" r="14" fill="#FFE600" stroke="#0D0D0D" stroke-width="3"/>
  <circle cx="240" cy="195" r="5" fill="#0D0D0D"/>
  <circle cx="320" cy="195" r="5" fill="#0D0D0D"/>
  <!-- mouth -->
  <rect x="230" y="240" width="100" height="14" rx="2" fill="#FF1F8E"/>
  <rect x="240" y="240" width="6" height="14" fill="#0D0D0D"/>
  <rect x="260" y="240" width="6" height="14" fill="#0D0D0D"/>
  <rect x="280" y="240" width="6" height="14" fill="#0D0D0D"/>
  <rect x="300" y="240" width="6" height="14" fill="#0D0D0D"/>
  <rect x="320" y="240" width="6" height="14" fill="#0D0D0D"/>
  <!-- neck -->
  <rect x="240" y="280" width="80" height="22" fill="#0D0D0D"/>
  <rect x="248" y="284" width="64" height="14" fill="#FF1F8E"/>
  <!-- body -->
  <rect x="140" y="302" width="280" height="200" rx="14" fill="url(#bodyGrad)" stroke="#0D0D0D" stroke-width="6"/>
  <!-- chest plate -->
  <rect x="200" y="330" width="160" height="100" rx="6" fill="#0D0D0D"/>
  <!-- chest bolt -->
  <path d="M275 350 L256 390 L274 392 L268 430 L300 380 L282 378 L290 350 Z" fill="#FFE600" stroke="#FF5C00" stroke-width="2"/>
  <!-- indicators -->
  <circle cx="170" cy="340" r="10" fill="#00E5FF" stroke="#0D0D0D" stroke-width="3"/>
  <circle cx="170" cy="370" r="10" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="3"/>
  <circle cx="170" cy="400" r="10" fill="#FFE600" stroke="#0D0D0D" stroke-width="3"/>
  <rect x="380" y="335" width="32" height="70" rx="4" fill="#0D0D0D"/>
  <rect x="386" y="345" width="20" height="6" fill="#FF5C00"/>
  <rect x="386" y="357" width="20" height="6" fill="#FFE600"/>
  <rect x="386" y="369" width="20" height="6" fill="#00E5FF"/>
  <rect x="386" y="381" width="20" height="6" fill="#FF1F8E"/>
  <!-- arms -->
  <rect x="100" y="320" width="40" height="140" rx="8" fill="#0D0D0D"/>
  <rect x="110" y="330" width="20" height="120" rx="4" fill="#FF5C00"/>
  <rect x="420" y="320" width="40" height="140" rx="8" fill="#0D0D0D"/>
  <rect x="430" y="330" width="20" height="120" rx="4" fill="#FF5C00"/>
  <!-- hands -->
  <rect x="80" y="460" width="80" height="40" rx="6" fill="#FFE600" stroke="#0D0D0D" stroke-width="5"/>
  <rect x="400" y="460" width="80" height="40" rx="6" fill="#FFE600" stroke="#0D0D0D" stroke-width="5"/>
  <!-- belt -->
  <rect x="140" y="470" width="280" height="32" fill="#0D0D0D"/>
  <rect x="260" y="470" width="40" height="32" fill="#FF1F8E"/>
  <path d="M275 472 L268 488 L278 488 L272 502 L286 484 L276 484 L282 472 Z" fill="#FFE600"/>
  <!-- legs -->
  <rect x="170" y="502" width="60" height="120" rx="6" fill="#0D0D0D"/>
  <rect x="180" y="512" width="40" height="100" rx="4" fill="#FF5C00"/>
  <rect x="330" y="502" width="60" height="120" rx="6" fill="#0D0D0D"/>
  <rect x="340" y="512" width="40" height="100" rx="4" fill="#FF5C00"/>
  <!-- feet -->
  <rect x="150" y="615" width="100" height="20" rx="4" fill="#FFE600" stroke="#0D0D0D" stroke-width="4"/>
  <rect x="310" y="615" width="100" height="20" rx="4" fill="#FFE600" stroke="#0D0D0D" stroke-width="4"/>
</svg>
