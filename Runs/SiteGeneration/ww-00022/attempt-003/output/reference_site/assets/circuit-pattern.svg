<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="circuit" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent"/>
      <g stroke="#0D0D0D" stroke-width="2" fill="none">
        <path d="M0 60 L40 60 L40 20 L80 20 L80 60 L120 60"/>
        <path d="M60 0 L60 30 L100 30 L100 80 L60 80 L60 120"/>
        <path d="M0 100 L30 100 L30 80 L60 80"/>
      </g>
      <g fill="#0D0D0D">
        <circle cx="40" cy="60" r="4"/>
        <circle cx="80" cy="20" r="4"/>
        <circle cx="100" cy="30" r="4"/>
        <circle cx="60" cy="80" r="4"/>
        <circle cx="30" cy="100" r="4"/>
      </g>
      <!-- Spark -->
      <g transform="translate(20,40)" fill="#0D0D0D">
        <path d="M0 0 L-6 12 L0 12 L-4 24 L8 8 L2 8 L6 0 Z"/>
      </g>
      <g transform="translate(96,90)" fill="#0D0D0D">
        <path d="M0 0 L-6 12 L0 12 L-4 24 L8 8 L2 8 L6 0 Z"/>
      </g>
      <!-- Diagonal stripes -->
      <line x1="0" y1="120" x2="120" y2="0" stroke="#0D0D0D" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#circuit)"/>
</svg>
