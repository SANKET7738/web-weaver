<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" fill="none" aria-label="BoltWorks division wristbands">
  <!-- Wristband 1 - Sparks -->
  <g transform="translate(20,30) rotate(-8)">
    <rect x="0" y="0" width="260" height="56" fill="#FFE600" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="0" y="0" width="60" height="56" fill="#FF1F8E"/>
    <path d="M30 12 L20 32 L30 32 L24 50 L42 28 L32 28 L36 12 Z" fill="#FFE600" stroke="#0D0D0D" stroke-width="2" stroke-linejoin="round" transform="translate(-6,-2)"/>
    <text x="150" y="22" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="22" fill="#0D0D0D" letter-spacing="6">SPARKS</text>
    <text x="150" y="42" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="10" fill="#0D0D0D" letter-spacing="4">AGES 8 - 11</text>
    <!-- Wristband ridges -->
    <g stroke="#0D0D0D" stroke-width="1" opacity="0.4">
      <line x1="80" y1="0" x2="80" y2="56"/>
      <line x1="240" y1="0" x2="240" y2="56"/>
    </g>
  </g>

  <!-- Wristband 2 - Voltage -->
  <g transform="translate(20,150) rotate(4)">
    <rect x="0" y="0" width="260" height="56" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="0" y="0" width="60" height="56" fill="#FFE600"/>
    <path d="M30 12 L20 32 L30 32 L24 50 L42 28 L32 28 L36 12 Z" fill="#0D0D0D" stroke-linejoin="round" transform="translate(-6,-2)"/>
    <text x="150" y="22" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="22" fill="#FFE600" letter-spacing="6">VOLTAGE</text>
    <text x="150" y="42" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="10" fill="#FFE600" letter-spacing="4">AGES 12 - 14</text>
    <g stroke="#0D0D0D" stroke-width="1" opacity="0.4">
      <line x1="80" y1="0" x2="80" y2="56"/>
      <line x1="240" y1="0" x2="240" y2="56"/>
    </g>
  </g>

  <!-- Wristband 3 - Apex -->
  <g transform="translate(20,270) rotate(-3)">
    <rect x="0" y="0" width="260" height="56" fill="#0D0D0D" stroke="#FFE600" stroke-width="3"/>
    <rect x="0" y="0" width="60" height="56" fill="#FF5C00"/>
    <path d="M30 12 L20 32 L30 32 L24 50 L42 28 L32 28 L36 12 Z" fill="#FFE600" stroke="#0D0D0D" stroke-width="2" stroke-linejoin="round" transform="translate(-6,-2)"/>
    <text x="150" y="22" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="22" fill="#FFE600" letter-spacing="6">APEX</text>
    <text x="150" y="42" text-anchor="middle" font-family="Bebas Neue, Arial Black" font-size="10" fill="#00E5FF" letter-spacing="4">AGES 15 - 18</text>
    <g stroke="#FFE600" stroke-width="1" opacity="0.4">
      <line x1="80" y1="0" x2="80" y2="56"/>
      <line x1="240" y1="0" x2="240" y2="56"/>
    </g>
  </g>
</svg>
