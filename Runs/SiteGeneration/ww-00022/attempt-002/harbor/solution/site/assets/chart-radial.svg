<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Radial bar chart of membership growth 2016-2024">
  <!-- Center label -->
  <circle cx="180" cy="180" r="48" fill="#FFE600" stroke="#FFE600" stroke-width="2"/>
  <text x="180" y="172" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="11" letter-spacing="2" fill="#0D0D0D">MEMBERS</text>
  <text x="180" y="194" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="22" fill="#0D0D0D">250+</text>

  <!-- Radial bars: 9 segments rotating around center -->
  <!-- Each bar represents a year's membership; thickness = members. -->
  <g stroke="#0D0D0D" stroke-width="2">
    <!-- 2016 -->
    <g transform="translate(180 180) rotate(-90)">
      <rect x="50" y="-8" width="40" height="16" fill="#FF1F8E"/>
      <text x="92" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2" transform="rotate(0)">2016 · 30</text>
    </g>
    <!-- 2017 -->
    <g transform="translate(180 180) rotate(-50)">
      <rect x="50" y="-8" width="58" height="16" fill="#FF5C00"/>
      <text x="110" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2">2017 · 60</text>
    </g>
    <!-- 2018 -->
    <g transform="translate(180 180) rotate(-10)">
      <rect x="50" y="-8" width="70" height="16" fill="#FFE600"/>
      <text x="122" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#0D0D0D" letter-spacing="2">2018 · 85</text>
    </g>
    <!-- 2019 -->
    <g transform="translate(180 180) rotate(30)">
      <rect x="50" y="-8" width="90" height="16" fill="#00E5FF"/>
      <text x="142" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2">2019 · 120</text>
    </g>
    <!-- 2020 -->
    <g transform="translate(180 180) rotate(70)">
      <rect x="50" y="-8" width="100" height="16" fill="#FF1F8E"/>
      <text x="152" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2">2020 · 150</text>
    </g>
    <!-- 2021 -->
    <g transform="translate(180 180) rotate(110)">
      <rect x="50" y="-8" width="115" height="16" fill="#FF5C00"/>
      <text x="-5" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2" transform="rotate(180 70 0)">2021 · 175</text>
    </g>
    <!-- 2022 -->
    <g transform="translate(180 180) rotate(150)">
      <rect x="50" y="-8" width="130" height="16" fill="#FFE600"/>
      <text x="-5" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#0D0D0D" letter-spacing="2" transform="rotate(180 75 0)">2022 · 200</text>
    </g>
    <!-- 2023 -->
    <g transform="translate(180 180) rotate(190)">
      <rect x="50" y="-8" width="142" height="16" fill="#00E5FF"/>
      <text x="-5" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2" transform="rotate(180 75 0)">2023 · 225</text>
    </g>
    <!-- 2024 -->
    <g transform="translate(180 180) rotate(230)">
      <rect x="50" y="-8" width="155" height="16" fill="#FF1F8E"/>
      <text x="-5" y="4" font-family="Bebas Neue, Impact, sans-serif" font-size="10" fill="#FFE600" letter-spacing="2" transform="rotate(180 75 0)">2024 · 250+</text>
    </g>
  </g>
</svg>
