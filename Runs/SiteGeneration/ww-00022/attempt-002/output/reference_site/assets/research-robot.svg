<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" role="img" aria-label="Robot arm reaching for lightbulb">
  <defs>
    <radialGradient id="rr-glow" cx="0.65" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow background -->
  <circle cx="420" cy="180" r="160" fill="url(#rr-glow)"/>

  <!-- Circuit traces -->
  <g stroke="#00E5FF" stroke-width="2" fill="none" opacity="0.7">
    <path d="M40 480 L120 480 L120 420 L200 420"/>
    <path d="M40 440 L80 440 L80 380 L160 380"/>
    <path d="M40 520 L300 520"/>
    <circle cx="120" cy="480" r="4" fill="#00E5FF"/>
    <circle cx="80" cy="380" r="4" fill="#00E5FF"/>
    <circle cx="160" cy="380" r="4" fill="#00E5FF"/>
  </g>

  <!-- Data graph in background -->
  <g opacity="0.4">
    <rect x="40" y="40" width="180" height="100" fill="none" stroke="#FF1F8E" stroke-width="2"/>
    <polyline points="50,120 75,90 100,100 130,60 160,80 195,50 215,60" fill="none" stroke="#FFE600" stroke-width="3"/>
    <line x1="40" y1="140" x2="220" y2="140" stroke="#F5F0DC" stroke-width="1"/>
    <line x1="40" y1="40" x2="40" y2="140" stroke="#F5F0DC" stroke-width="1"/>
  </g>

  <!-- Arm base -->
  <rect x="80" y="380" width="120" height="50" fill="#1E1E2A" stroke="#FFE600" stroke-width="4"/>
  <rect x="100" y="370" width="80" height="14" fill="#FF5C00"/>

  <!-- Arm segment 1 (lower) -->
  <rect x="130" y="220" width="32" height="170" rx="6" fill="#FFE600" stroke="#0D0D0D" stroke-width="5" transform="rotate(-15 146 305)"/>
  <circle cx="146" cy="395" r="22" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="5"/>
  <circle cx="146" cy="395" r="8" fill="#0D0D0D"/>

  <!-- Arm segment 2 (upper) -->
  <rect x="200" y="160" width="28" height="160" rx="6" fill="#FF5C00" stroke="#0D0D0D" stroke-width="5" transform="rotate(35 214 240)"/>
  <circle cx="220" cy="225" r="20" fill="#00E5FF" stroke="#0D0D0D" stroke-width="5"/>
  <circle cx="220" cy="225" r="6" fill="#0D0D0D"/>

  <!-- Gripper -->
  <g transform="translate(355 165) rotate(-25)">
    <rect x="-6" y="-30" width="12" height="40" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="4"/>
    <rect x="-30" y="0" width="20" height="6" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="10" y="0" width="20" height="6" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="-30" y="-12" width="6" height="22" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="24" y="-12" width="6" height="22" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="3"/>
  </g>

  <!-- Lightbulb -->
  <g transform="translate(440 130)">
    <!-- Glow rays -->
    <g stroke="#FFE600" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-90" x2="0" y2="-130"/>
      <line x1="-60" y1="-60" x2="-90" y2="-90"/>
      <line x1="60" y1="-60" x2="90" y2="-90"/>
      <line x1="-90" y1="0" x2="-130" y2="0"/>
      <line x1="90" y1="0" x2="130" y2="0"/>
      <line x1="-60" y1="60" x2="-85" y2="85"/>
      <line x1="60" y1="60" x2="85" y2="85"/>
    </g>
    <!-- Bulb body -->
    <circle cx="0" cy="0" r="60" fill="#FFE600" stroke="#0D0D0D" stroke-width="6"/>
    <!-- Filament -->
    <path d="M-22 12 Q-10 -25 0 0 Q10 25 22 -12" fill="none" stroke="#0D0D0D" stroke-width="4"/>
    <line x1="-22" y1="20" x2="-15" y2="34" stroke="#0D0D0D" stroke-width="4"/>
    <line x1="22" y1="20" x2="15" y2="34" stroke="#0D0D0D" stroke-width="4"/>
    <!-- Base -->
    <rect x="-22" y="42" width="44" height="22" fill="#1E1E2A" stroke="#0D0D0D" stroke-width="4"/>
    <line x1="-22" y1="50" x2="22" y2="50" stroke="#FFE600" stroke-width="2"/>
    <line x1="-22" y1="58" x2="22" y2="58" stroke="#FFE600" stroke-width="2"/>
    <rect x="-12" y="64" width="24" height="10" fill="#0D0D0D"/>
  </g>

  <!-- Spark dots -->
  <circle cx="380" cy="70" r="5" fill="#FF1F8E"/>
  <circle cx="540" cy="60" r="4" fill="#00E5FF"/>
  <circle cx="500" cy="280" r="5" fill="#FFE600"/>
  <circle cx="280" cy="450" r="4" fill="#FF1F8E"/>
</svg>
