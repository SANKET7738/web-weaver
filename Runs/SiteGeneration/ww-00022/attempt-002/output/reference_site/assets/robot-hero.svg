<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-label="BoltWorks festival-poster robot">
  <defs>
    <linearGradient id="rg-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1F8E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFE600" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="100%" stop-color="#FF5C00"/>
    </linearGradient>
    <radialGradient id="rg-eye" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
  </defs>

  <!-- Energy radiating lines -->
  <g stroke="#FFE600" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="300" y1="60" x2="300" y2="20"/>
    <line x1="200" y1="90" x2="170" y2="60"/>
    <line x1="400" y1="90" x2="430" y2="60"/>
    <line x1="120" y1="200" x2="80" y2="200"/>
    <line x1="480" y1="200" x2="520" y2="200"/>
    <line x1="120" y1="320" x2="60" y2="320"/>
    <line x1="480" y1="320" x2="540" y2="320"/>
  </g>

  <!-- Glow circle -->
  <circle cx="300" cy="350" r="280" fill="url(#rg-glow)" opacity="0.45"/>

  <!-- Lightning bolts -->
  <path d="M70 120 L120 120 L100 180 L150 180 L80 280 L105 200 L60 200 Z"
        fill="#FFE600" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="miter"/>
  <path d="M530 460 L580 460 L555 525 L605 525 L535 625 L560 545 L515 545 Z"
        fill="#FF1F8E" stroke="#0D0D0D" stroke-width="3" stroke-linejoin="miter"/>

  <!-- Antenna -->
  <line x1="300" y1="180" x2="300" y2="100" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="92" r="14" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="3"/>

  <!-- Head -->
  <rect x="200" y="170" width="200" height="160" rx="12" fill="url(#rg-body)" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="200" y="170" width="200" height="40" fill="#0D0D0D"/>
  <text x="300" y="200" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="22" fill="#FFE600" letter-spacing="2">BOLTWORKS</text>

  <!-- Eyes -->
  <circle cx="248" cy="262" r="32" fill="#0D0D0D" stroke="#0D0D0D" stroke-width="4"/>
  <circle cx="352" cy="262" r="32" fill="#0D0D0D" stroke="#0D0D0D" stroke-width="4"/>
  <circle cx="248" cy="262" r="20" fill="url(#rg-eye)"/>
  <circle cx="352" cy="262" r="20" fill="url(#rg-eye)"/>
  <circle cx="252" cy="258" r="6" fill="#FFFFFF"/>
  <circle cx="356" cy="258" r="6" fill="#FFFFFF"/>

  <!-- Mouth grill -->
  <rect x="245" y="305" width="110" height="14" fill="#0D0D0D"/>
  <line x1="260" y1="305" x2="260" y2="319" stroke="#FFE600" stroke-width="3"/>
  <line x1="280" y1="305" x2="280" y2="319" stroke="#FFE600" stroke-width="3"/>
  <line x1="300" y1="305" x2="300" y2="319" stroke="#FFE600" stroke-width="3"/>
  <line x1="320" y1="305" x2="320" y2="319" stroke="#FFE600" stroke-width="3"/>
  <line x1="340" y1="305" x2="340" y2="319" stroke="#FFE600" stroke-width="3"/>

  <!-- Neck -->
  <rect x="270" y="330" width="60" height="30" fill="#1E1E2A" stroke="#0D0D0D" stroke-width="4"/>

  <!-- Body -->
  <rect x="160" y="360" width="280" height="220" rx="16" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="6"/>
  <!-- Body chest plate -->
  <rect x="220" y="395" width="160" height="120" fill="#0D0D0D" stroke="#FFE600" stroke-width="4"/>
  <text x="300" y="445" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="44" fill="#FFE600">⚡</text>
  <circle cx="240" cy="490" r="8" fill="#00E5FF"/>
  <circle cx="270" cy="490" r="8" fill="#FFE600"/>
  <circle cx="330" cy="490" r="8" fill="#FF5C00"/>
  <circle cx="360" cy="490" r="8" fill="#00E5FF"/>

  <!-- Shoulders / arms -->
  <rect x="120" y="380" width="50" height="120" rx="8" fill="#FFE600" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="430" y="380" width="50" height="120" rx="8" fill="#FFE600" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="115" y="500" width="60" height="80" rx="8" fill="#FF5C00" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="425" y="500" width="60" height="80" rx="8" fill="#FF5C00" stroke="#0D0D0D" stroke-width="6"/>
  <!-- Hands -->
  <circle cx="145" cy="595" r="22" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="5"/>
  <circle cx="455" cy="595" r="22" fill="#FFFFFF" stroke="#0D0D0D" stroke-width="5"/>

  <!-- Legs / base -->
  <rect x="200" y="580" width="60" height="80" fill="#1E1E2A" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="340" y="580" width="60" height="80" fill="#1E1E2A" stroke="#0D0D0D" stroke-width="6"/>
  <rect x="180" y="660" width="100" height="20" fill="#FFE600" stroke="#0D0D0D" stroke-width="5"/>
  <rect x="320" y="660" width="100" height="20" fill="#FFE600" stroke="#0D0D0D" stroke-width="5"/>

  <!-- Spark dots -->
  <circle cx="80" cy="430" r="6" fill="#FFE600"/>
  <circle cx="540" cy="380" r="6" fill="#00E5FF"/>
  <circle cx="510" cy="280" r="5" fill="#FFE600"/>
  <circle cx="100" cy="540" r="5" fill="#FF1F8E"/>
</svg>
