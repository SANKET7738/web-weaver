<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" role="img" aria-label="Vintage poster garage workshop">
  <defs>
    <linearGradient id="ga-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF1F8E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D0D0D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect x="40" y="40" width="420" height="360" fill="#1E1E2A" stroke="#FFE600" stroke-width="6"/>
  <rect x="40" y="40" width="420" height="40" fill="#FFE600"/>
  <text x="250" y="68" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif" font-size="22" fill="#0D0D0D" letter-spacing="3">EST. 2016</text>

  <!-- Garage door panels -->
  <line x1="40" y1="120" x2="460" y2="120" stroke="#FF5C00" stroke-width="3"/>
  <line x1="40" y1="160" x2="460" y2="160" stroke="#FF5C00" stroke-width="3" opacity="0.4"/>
  <line x1="40" y1="200" x2="460" y2="200" stroke="#FF5C00" stroke-width="3" opacity="0.3"/>

  <!-- Big gear -->
  <g transform="translate(140 250)">
    <circle r="80" fill="#FFE600" stroke="#0D0D0D" stroke-width="6"/>
    <circle r="22" fill="#0D0D0D"/>
    <g fill="#0D0D0D">
      <rect x="-10" y="-94" width="20" height="20"/>
      <rect x="-10" y="74" width="20" height="20"/>
      <rect x="-94" y="-10" width="20" height="20"/>
      <rect x="74" y="-10" width="20" height="20"/>
      <rect x="-72" y="-72" width="20" height="20" transform="rotate(45 -62 -62)"/>
      <rect x="52" y="-72" width="20" height="20" transform="rotate(45 62 -62)"/>
      <rect x="-72" y="52" width="20" height="20" transform="rotate(45 -62 62)"/>
      <rect x="52" y="52" width="20" height="20" transform="rotate(45 62 62)"/>
    </g>
  </g>

  <!-- Small gear -->
  <g transform="translate(260 200)">
    <circle r="42" fill="#FF1F8E" stroke="#0D0D0D" stroke-width="5"/>
    <circle r="12" fill="#0D0D0D"/>
    <g fill="#0D0D0D">
      <rect x="-6" y="-50" width="12" height="12"/>
      <rect x="-6" y="38" width="12" height="12"/>
      <rect x="-50" y="-6" width="12" height="12"/>
      <rect x="38" y="-6" width="12" height="12"/>
    </g>
  </g>

  <!-- Workbench -->
  <rect x="290" y="290" width="160" height="14" fill="#FFE600" stroke="#0D0D0D" stroke-width="4"/>
  <rect x="295" y="304" width="12" height="80" fill="#0D0D0D"/>
  <rect x="433" y="304" width="12" height="80" fill="#0D0D0D"/>

  <!-- Tiny robot on bench -->
  <g transform="translate(335 235)">
    <rect x="0" y="0" width="50" height="50" fill="#00E5FF" stroke="#0D0D0D" stroke-width="4"/>
    <line x1="25" y1="0" x2="25" y2="-12" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="25" cy="-15" r="4" fill="#FFE600"/>
    <circle cx="14" cy="20" r="5" fill="#0D0D0D"/>
    <circle cx="36" cy="20" r="5" fill="#0D0D0D"/>
    <rect x="14" y="32" width="22" height="6" fill="#0D0D0D"/>
    <rect x="-6" y="50" width="62" height="6" fill="#FF5C00"/>
  </g>

  <!-- Tools -->
  <g transform="translate(60 330)">
    <!-- Wrench -->
    <rect x="0" y="20" width="80" height="10" fill="#F5F0DC" stroke="#0D0D0D" stroke-width="3"/>
    <circle cx="0" cy="25" r="14" fill="none" stroke="#F5F0DC" stroke-width="6"/>
    <circle cx="0" cy="25" r="6" fill="#0D0D0D"/>
  </g>
  <g transform="translate(380 80)">
    <!-- Screwdriver -->
    <rect x="0" y="0" width="14" height="50" fill="#FF5C00" stroke="#0D0D0D" stroke-width="3"/>
    <rect x="3" y="50" width="8" height="60" fill="#F5F0DC" stroke="#0D0D0D" stroke-width="3"/>
  </g>

  <!-- Floor / shadow -->
  <rect x="40" y="395" width="420" height="6" fill="#FF5C00"/>

  <!-- Sparks -->
  <circle cx="200" cy="170" r="5" fill="#FFE600"/>
  <circle cx="220" cy="150" r="3" fill="#FF1F8E"/>
  <circle cx="80" cy="140" r="4" fill="#00E5FF"/>

  <!-- Banner -->
  <rect x="40" y="400" width="420" height="40" fill="#0D0D0D" stroke="#FFE600" stroke-width="3"/>
  <text x="250" y="427" text-anchor="middle" font-family="Bebas Neue, Impact, sans-serif" font-size="20" fill="#FFE600" letter-spacing="6">BOLTWORKS GARAGE</text>
</svg>
