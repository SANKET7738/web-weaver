<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="loftSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2533"/>
      <stop offset="1" stop-color="#0D1F3C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#loftSky)"/>
  <!-- Adjacent towers -->
  <rect x="0" y="40" width="80" height="180" fill="#0A1830"/>
  <rect x="320" y="20" width="80" height="200" fill="#0A1830"/>
  <!-- Foreground tower with floor 42 highlighted -->
  <rect x="100" y="30" width="200" height="190" fill="#08111F"/>
  <!-- Window grid -->
  <g fill="#B89A5E" opacity="0.25">
    <rect x="112" y="46" width="176" height="6"/>
    <rect x="112" y="60" width="176" height="6"/>
    <rect x="112" y="74" width="176" height="6"/>
    <rect x="112" y="88" width="176" height="6"/>
    <rect x="112" y="118" width="176" height="6"/>
    <rect x="112" y="132" width="176" height="6"/>
    <rect x="112" y="146" width="176" height="6"/>
    <rect x="112" y="160" width="176" height="6"/>
    <rect x="112" y="174" width="176" height="6"/>
    <rect x="112" y="188" width="176" height="6"/>
  </g>
  <!-- Highlighted floor 42 -->
  <rect x="108" y="100" width="184" height="14" fill="#B89A5E" opacity="0.85"/>
  <rect x="108" y="100" width="184" height="14" fill="none" stroke="#F7F8FA" stroke-width="0.5" opacity="0.4"/>
  <!-- Side towers windows -->
  <g fill="#B89A5E" opacity="0.4">
    <rect x="14" y="60" width="50" height="3"/>
    <rect x="14" y="80" width="50" height="3"/>
    <rect x="14" y="100" width="50" height="3"/>
    <rect x="14" y="120" width="50" height="3"/>
    <rect x="14" y="140" width="50" height="3"/>
    <rect x="14" y="160" width="50" height="3"/>
    <rect x="14" y="180" width="50" height="3"/>
    <rect x="334" y="40" width="50" height="3"/>
    <rect x="334" y="60" width="50" height="3"/>
    <rect x="334" y="80" width="50" height="3"/>
    <rect x="334" y="100" width="50" height="3"/>
    <rect x="334" y="120" width="50" height="3"/>
    <rect x="334" y="140" width="50" height="3"/>
    <rect x="334" y="160" width="50" height="3"/>
    <rect x="334" y="180" width="50" height="3"/>
  </g>
  <!-- 42 marker -->
  <text x="200" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0D1F3C">42A</text>
