<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2533"/>
      <stop offset="0.55" stop-color="#0D1F3C"/>
      <stop offset="1" stop-color="#040813"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B89A5E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#B89A5E" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.78" cy="0.22" r="0.28">
      <stop offset="0" stop-color="#D6E4F5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0D1F3C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="windowPattern" width="14" height="22" patternUnits="userSpaceOnUse">
      <rect width="6" height="9" x="2" y="3" fill="url(#windowGlow)"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#moonglow)"/>

  <!-- Distant mountains/horizon haze -->
  <path d="M0 590 L160 560 L300 580 L460 540 L640 565 L840 535 L1020 560 L1240 530 L1400 555 L1600 540 L1600 620 L0 620 Z" fill="#0A1830" opacity="0.6"/>

  <!-- Far skyline -->
  <g opacity="0.55">
    <rect x="40" y="500" width="60" height="160" fill="#0A1A33"/>
    <rect x="120" y="470" width="80" height="190" fill="#0A1A33"/>
    <rect x="220" y="520" width="44" height="140" fill="#0A1A33"/>
    <rect x="280" y="460" width="100" height="200" fill="#0A1A33"/>
    <rect x="400" y="495" width="64" height="165" fill="#0A1A33"/>
    <rect x="500" y="450" width="90" height="210" fill="#0A1A33"/>
    <rect x="620" y="510" width="50" height="150" fill="#0A1A33"/>
    <rect x="700" y="475" width="86" height="185" fill="#0A1A33"/>
    <rect x="820" y="440" width="100" height="220" fill="#0A1A33"/>
    <rect x="950" y="490" width="58" height="170" fill="#0A1A33"/>
    <rect x="1040" y="460" width="84" height="200" fill="#0A1A33"/>
    <rect x="1160" y="480" width="60" height="180" fill="#0A1A33"/>
    <rect x="1240" y="445" width="100" height="215" fill="#0A1A33"/>
    <rect x="1370" y="500" width="60" height="160" fill="#0A1A33"/>
    <rect x="1450" y="470" width="100" height="190" fill="#0A1A33"/>
  </g>

  <!-- Mid skyline -->
  <g>
    <rect x="0" y="540" width="120" height="360" fill="#091525"/>
    <rect x="120" y="500" width="80" height="400" fill="#0B182B"/>
    <rect x="200" y="470" width="120" height="430" fill="#091525"/>
    <rect x="320" y="540" width="60" height="360" fill="#0B182B"/>
    <rect x="380" y="430" width="140" height="470" fill="#091525"/>
    <rect x="520" y="490" width="80" height="410" fill="#0B182B"/>
    <rect x="600" y="380" width="160" height="520" fill="#091525"/>
    <rect x="760" y="450" width="100" height="450" fill="#0B182B"/>
    <rect x="860" y="350" width="180" height="550" fill="#091525"/>
    <rect x="1040" y="430" width="100" height="470" fill="#0B182B"/>
    <rect x="1140" y="490" width="80" height="410" fill="#091525"/>
    <rect x="1220" y="400" width="140" height="500" fill="#0B182B"/>
    <rect x="1360" y="460" width="100" height="440" fill="#091525"/>
    <rect x="1460" y="520" width="80" height="380" fill="#0B182B"/>
    <rect x="1540" y="440" width="60" height="460" fill="#091525"/>
  </g>

  <!-- Window pattern for mid buildings -->
  <g opacity="0.85">
    <rect x="200" y="490" width="120" height="410" fill="url(#windowPattern)" opacity="0.7"/>
    <rect x="380" y="450" width="140" height="450" fill="url(#windowPattern)" opacity="0.65"/>
    <rect x="600" y="400" width="160" height="500" fill="url(#windowPattern)" opacity="0.7"/>
    <rect x="860" y="370" width="180" height="530" fill="url(#windowPattern)" opacity="0.7"/>
    <rect x="1220" y="420" width="140" height="480" fill="url(#windowPattern)" opacity="0.65"/>
  </g>

  <!-- Foreground tower (signature) -->
  <g>
    <rect x="700" y="180" width="100" height="720" fill="#08111F"/>
    <polygon points="700,180 750,140 800,180" fill="#08111F"/>
    <line x1="750" y1="140" x2="750" y2="115" stroke="#B89A5E" stroke-width="2"/>
    <circle cx="750" cy="112" r="3" fill="#B89A5E"/>
    <!-- Window grid -->
    <g fill="#B89A5E">
      <g opacity="0.85">
        <rect x="712" y="220" width="6" height="10"/>
        <rect x="724" y="220" width="6" height="10"/>
        <rect x="736" y="220" width="6" height="10"/>
        <rect x="748" y="220" width="6" height="10"/>
        <rect x="760" y="220" width="6" height="10"/>
        <rect x="772" y="220" width="6" height="10"/>
        <rect x="784" y="220" width="6" height="10"/>
      </g>
    </g>
  </g>
  <!-- Repeat windows down the foreground tower using pattern -->
  <rect x="710" y="220" width="80" height="660" fill="url(#windowPattern)" opacity="0.95"/>

  <!-- Foreground horizon baseline -->
  <rect x="0" y="880" width="1600" height="20" fill="#040813"/>
</svg>
