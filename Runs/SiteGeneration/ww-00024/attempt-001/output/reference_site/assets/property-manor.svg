<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="mnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A6C2E0"/>
      <stop offset="1" stop-color="#D6E4F5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#mnSky)"/>
  <!-- Distant hills -->
  <path d="M0 130 L80 105 L160 120 L240 95 L320 110 L400 90 L400 160 L0 160 Z" fill="#4A5568" opacity="0.4"/>
  <!-- Tree row -->
  <g fill="#0D1F3C" opacity="0.55">
    <ellipse cx="40" cy="155" rx="22" ry="20"/>
    <ellipse cx="80" cy="155" rx="22" ry="20"/>
    <ellipse cx="320" cy="155" rx="22" ry="20"/>
    <ellipse cx="360" cy="155" rx="22" ry="20"/>
  </g>
  <!-- Manor (large estate) -->
  <g>
    <!-- Wings -->
    <rect x="60" y="120" width="80" height="80" fill="#ECEEF1"/>
    <polygon points="60,120 100,90 140,120" fill="#1C2533"/>
    <rect x="260" y="120" width="80" height="80" fill="#ECEEF1"/>
    <polygon points="260,120 300,90 340,120" fill="#1C2533"/>
    <!-- Center -->
    <rect x="140" y="100" width="120" height="100" fill="#F7F8FA"/>
    <polygon points="140,100 200,65 260,100" fill="#1C2533"/>
    <!-- Center cupola -->
    <rect x="195" y="55" width="10" height="14" fill="#B89A5E"/>
    <polygon points="195,55 200,42 205,55" fill="#B89A5E"/>
    <!-- Columns -->
    <rect x="158" y="115" width="4" height="80" fill="#D6E4F5"/>
    <rect x="180" y="115" width="4" height="80" fill="#D6E4F5"/>
    <rect x="216" y="115" width="4" height="80" fill="#D6E4F5"/>
    <rect x="238" y="115" width="4" height="80" fill="#D6E4F5"/>
    <!-- Windows center -->
    <g fill="#0D1F3C">
      <rect x="166" y="120" width="12" height="20"/>
      <rect x="222" y="120" width="12" height="20"/>
      <rect x="166" y="150" width="12" height="20"/>
      <rect x="222" y="150" width="12" height="20"/>
    </g>
    <!-- Door -->
    <rect x="194" y="170" width="14" height="30" fill="#B89A5E"/>
    <!-- Wing windows -->
    <g fill="#0D1F3C">
      <rect x="72" y="135" width="12" height="18"/>
      <rect x="92" y="135" width="12" height="18"/>
      <rect x="112" y="135" width="12" height="18"/>
      <rect x="72" y="160" width="12" height="18"/>
      <rect x="92" y="160" width="12" height="18"/>
      <rect x="112" y="160" width="12" height="18"/>
      <rect x="272" y="135" width="12" height="18"/>
      <rect x="292" y="135" width="12" height="18"/>
      <rect x="312" y="135" width="12" height="18"/>
      <rect x="272" y="160" width="12" height="18"/>
      <rect x="292" y="160" width="12" height="18"/>
      <rect x="312" y="160" width="12" height="18"/>
    </g>
  </g>
  <!-- Driveway -->
  <path d="M180 200 L220 200 L240 220 L160 220 Z" fill="#9B8B70" opacity="0.7"/>
  <rect x="0" y="200" width="400" height="20" fill="#3A4A2A" opacity="0.5"/>
</svg>
