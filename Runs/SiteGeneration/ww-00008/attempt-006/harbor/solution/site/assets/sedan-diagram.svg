<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet">
  <!-- top-down sedan in pixel-magenta -->
  <g stroke="#FF00CC" stroke-width="3" fill="none">
    <!-- body -->
    <rect x="380" y="80" width="440" height="120"/>
    <!-- windows -->
    <rect x="430" y="90" width="100" height="100"/>
    <rect x="540" y="90" width="120" height="100"/>
    <rect x="670" y="90" width="100" height="100"/>
    <!-- hood/trunk lines -->
    <line x1="380" y1="120" x2="380" y2="160"/>
    <line x1="820" y1="120" x2="820" y2="160"/>
    <!-- headlights -->
    <rect x="370" y="92" width="14" height="14"/>
    <rect x="370" y="174" width="14" height="14"/>
    <!-- taillights -->
    <rect x="816" y="92" width="14" height="14"/>
    <rect x="816" y="174" width="14" height="14"/>
    <!-- wheels -->
    <rect x="408" y="60" width="40" height="22"/>
    <rect x="752" y="60" width="40" height="22"/>
    <rect x="408" y="198" width="40" height="22"/>
    <rect x="752" y="198" width="40" height="22"/>
    <!-- mirrors -->
    <rect x="412" y="78" width="14" height="6"/>
    <rect x="412" y="198" width="14" height="6"/>
    <!-- side mirror lines -->
  </g>

  <!-- pixel art body fill stripes -->
  <g fill="#FF00CC" opacity="0.18">
    <rect x="380" y="80" width="440" height="6"/>
    <rect x="380" y="194" width="440" height="6"/>
  </g>

  <!-- numbered hotspots in lime -->
  <g>
    <circle cx="140" cy="140" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="140" y="148" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#110022">1</text>
    <line x1="160" y1="140" x2="370" y2="100" stroke="#00FF33" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="1060" cy="140" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="1060" y="148" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#110022">2</text>
    <line x1="1040" y1="140" x2="830" y2="180" stroke="#00FF33" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="600" cy="20" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="600" y="28" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#110022">3</text>
    <line x1="600" y1="42" x2="600" y2="78" stroke="#00FF33" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="600" cy="260" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="600" y="268" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#110022">4</text>
    <line x1="600" y1="238" x2="600" y2="202" stroke="#00FF33" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
</svg>
