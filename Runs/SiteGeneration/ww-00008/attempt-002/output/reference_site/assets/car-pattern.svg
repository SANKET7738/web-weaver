<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="dot" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" x="0" y="0" fill="#CC00FF" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- Tiny pixel-art car silhouette repeated as halftone -->
  <g fill="#CC00FF">
    <rect x="6" y="20" width="28" height="6"/>
    <rect x="2" y="26" width="36" height="4"/>
    <rect x="10" y="14" width="20" height="6"/>
    <rect x="6" y="30" width="6" height="4"/>
    <rect x="28" y="30" width="6" height="4"/>
    <rect x="46" y="56" width="28" height="6"/>
    <rect x="42" y="62" width="36" height="4"/>
    <rect x="50" y="50" width="20" height="6"/>
    <rect x="46" y="66" width="6" height="4"/>
    <rect x="68" y="66" width="6" height="4"/>
  </g>
  <rect width="80" height="80" fill="url(#dot)" opacity="0.3"/>
</svg>
