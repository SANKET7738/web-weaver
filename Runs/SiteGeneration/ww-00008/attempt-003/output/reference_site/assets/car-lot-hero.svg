      <rect x="22" y="3" width="2" height="2" fill="#FFFFFF"/>
      <rect x="33" y="17" width="2" height="2" fill="#00CCFF"/>
      <rect x="14" y="29" width="2" height="2" fill="#FF00CC"/>
