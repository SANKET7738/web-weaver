    <circle cx="14" cy="16" r="3" fill="none" stroke="#00FF33" stroke-width="2"/>
    <path d="M28 28 l4 4 l8 -8" fill="none" stroke="#FF00CC" stroke-width="3"/>
  </symbol>

  <symbol id="icon-price-tag" viewBox="0 0 44 44">
