    <circle cx="42" cy="42" r="6" fill="none" stroke="#00FF33" stroke-width="2"/>
    <circle cx="14" cy="42" r="2" fill="#00FF33"/>
    <circle cx="42" cy="42" r="2" fill="#00FF33"/>
    <line x1="20" y1="34" x2="36" y2="34" stroke="#FFFF00" stroke-width="2"/>
