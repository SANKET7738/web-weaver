<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="overlay" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#110022" stop-opacity="0.8"/>
      <stop offset="0.25" stop-color="#110022" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#110022" stop-opacity="0"/>
      <stop offset="1" stop-color="#110022" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" fill="#110022"/>

  <!-- Top-down sedan -->
  <g transform="translate(300, 40)" stroke="#FF00CC" stroke-width="3" fill="none">
    <!-- body outline -->
    <rect x="40" y="20" width="520" height="160" rx="20"/>
    <!-- hood -->
    <rect x="40" y="60" width="80" height="80"/>
    <!-- trunk -->
    <rect x="480" y="60" width="80" height="80"/>
    <!-- windshield -->
    <path d="M120 60 l30 -20 l160 0 l30 20 z"/>
    <!-- roof -->
    <rect x="150" y="60" width="240" height="80"/>
    <!-- rear window -->
    <path d="M390 60 l30 -20 l30 0 l30 20"/>
    <!-- wheels -->
    <rect x="60" y="2" width="60" height="20" fill="#FF00CC"/>
    <rect x="60" y="178" width="60" height="20" fill="#FF00CC"/>
    <rect x="440" y="2" width="60" height="20" fill="#FF00CC"/>
    <rect x="440" y="178" width="60" height="20" fill="#FF00CC"/>
    <!-- mirrors -->
    <rect x="120" y="0" width="20" height="14" fill="#FF00CC"/>
    <rect x="120" y="186" width="20" height="14" fill="#FF00CC"/>
    <!-- inner detail -->
    <line x1="180" y1="60" x2="180" y2="140" stroke-dasharray="4 4"/>
    <line x1="300" y1="60" x2="300" y2="140" stroke-dasharray="4 4"/>
    <line x1="270" y1="100" x2="320" y2="100"/>
  </g>

  <!-- Numbered hotspots -->
  <g font-family="VT323, monospace" font-size="20" fill="#110022" font-weight="bold">
    <g transform="translate(360, 40)">
      <circle r="18" fill="#00FF33" stroke="#FFFFFF" stroke-width="3"/>
      <text text-anchor="middle" dy="6">1</text>
    </g>
    <g transform="translate(840, 40)">
      <circle r="18" fill="#00FF33" stroke="#FFFFFF" stroke-width="3"/>
      <text text-anchor="middle" dy="6">2</text>
    </g>
    <g transform="translate(360, 240)">
      <circle r="18" fill="#00FF33" stroke="#FFFFFF" stroke-width="3"/>
      <text text-anchor="middle" dy="6">3</text>
    </g>
    <g transform="translate(840, 240)">
      <circle r="18" fill="#00FF33" stroke="#FFFFFF" stroke-width="3"/>
      <text text-anchor="middle" dy="6">4</text>
    </g>
  </g>

  <!-- Section labels -->
  <g font-family="VT323, monospace" font-size="18" fill="#FFFF00">
    <text x="280" y="30">FRONT</text>
    <text x="900" y="30">REAR</text>
    <text x="40" y="148" transform="rotate(-90 40 148)">DRIVER</text>
    <text x="1160" y="148" transform="rotate(90 1160 148)">PASSENGER</text>
  </g>

  <rect width="1200" height="280" fill="url(#overlay)"/>
</svg>
