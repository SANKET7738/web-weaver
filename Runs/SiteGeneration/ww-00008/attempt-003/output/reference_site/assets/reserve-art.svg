<svg viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="340" height="280" fill="#110022"/>
  <!-- starburst -->
  <g transform="translate(170, 40)">
    <polygon points="0,-30 6,-9 28,-9 10,4 16,26 0,12 -16,26 -10,4 -28,-9 -6,-9" fill="#FFFF00"/>
    <text y="6" text-anchor="middle" font-family="VT323" font-size="16" fill="#110022" font-weight="bold">YES!</text>
  </g>

  <!-- Reserved Car (side view, pixel) -->
  <g transform="translate(40, 110)">
    <!-- shadow -->
    <ellipse cx="130" cy="100" rx="120" ry="8" fill="#440066"/>
    <!-- body -->
    <rect x="20" y="40" width="220" height="40" fill="#00FF33" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="40" y="20" width="160" height="22" fill="#00FF33" stroke="#FFFFFF" stroke-width="2"/>
    <!-- windshield -->
    <polygon points="50,40 80,22 130,22 130,40" fill="#88CCFF" stroke="#110022" stroke-width="2"/>
    <polygon points="130,22 180,22 200,40 130,40" fill="#88CCFF" stroke="#110022" stroke-width="2"/>
    <!-- door line -->
    <line x1="130" y1="40" x2="130" y2="80" stroke="#110022" stroke-width="2"/>
    <!-- handles -->
    <rect x="80" y="55" width="14" height="3" fill="#110022"/>
    <rect x="160" y="55" width="14" height="3" fill="#110022"/>
    <!-- wheels -->
    <circle cx="60" cy="84" r="14" fill="#222" stroke="#888" stroke-width="3"/>
    <circle cx="60" cy="84" r="6" fill="#888"/>
    <circle cx="200" cy="84" r="14" fill="#222" stroke="#888" stroke-width="3"/>
    <circle cx="200" cy="84" r="6" fill="#888"/>
    <!-- headlight -->
    <rect x="234" y="48" width="8" height="10" fill="#FFFF00"/>
    <!-- RESERVED placard on windshield -->
    <rect x="100" y="26" width="60" height="14" fill="#FFFF00" stroke="#110022" stroke-width="2"/>
    <text x="130" y="36" text-anchor="middle" font-family="VT323" font-size="11" fill="#110022" font-weight="bold">RESERVED</text>
  </g>

  <!-- Big Key (foreground) -->
  <g transform="translate(190, 70)">
    <circle cx="0" cy="0" r="32" fill="#FFFF00" stroke="#110022" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#110022"/>
    <rect x="20" y="-8" width="100" height="16" fill="#FFFF00" stroke="#110022" stroke-width="3"/>
    <rect x="100" y="8" width="6" height="14" fill="#FFFF00" stroke="#110022" stroke-width="3"/>
    <rect x="112" y="8" width="6" height="10" fill="#FFFF00" stroke="#110022" stroke-width="3"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FF00CC">
    <rect x="20" y="40" width="6" height="2"/>
    <rect x="22" y="38" width="2" height="6"/>
    <rect x="300" y="100" width="6" height="2"/>
    <rect x="302" y="98" width="2" height="6"/>
    <rect x="280" y="200" width="6" height="2"/>
    <rect x="282" y="198" width="2" height="6"/>
  </g>
</svg>
