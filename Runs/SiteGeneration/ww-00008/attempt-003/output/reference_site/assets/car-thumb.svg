<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <rect width="200" height="120" fill="#C0C0C0"/>
  <!-- Diagonal stripes for "loading" feel -->
  <g opacity="0.25">
    <line x1="0" y1="0" x2="200" y2="120" stroke="#888" stroke-width="2"/>
    <line x1="0" y1="120" x2="200" y2="0" stroke="#888" stroke-width="2"/>
  </g>
  <!-- Pixel car silhouette -->
  <g transform="translate(40, 38)" fill="#6600CC">
    <rect x="0" y="20" width="120" height="24"/>
    <rect x="14" y="6" width="92" height="18"/>
    <polygon points="14,24 26,8 40,8 40,24"/>
    <rect x="20" y="44" width="20" height="8"/>
    <rect x="80" y="44" width="20" height="8"/>
    <circle cx="28" cy="52" r="6"/>
    <circle cx="92" cy="52" r="6"/>
  </g>
  <text x="100" y="100" text-anchor="middle" font-family="VT323, monospace" font-size="12" fill="#110022">[ PHOTO LOADING ]</text>
</svg>
