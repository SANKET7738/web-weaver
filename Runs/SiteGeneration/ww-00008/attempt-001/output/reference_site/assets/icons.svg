<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-wrench-check" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter">
      <path d="M6 30 L18 18 M14 14 a4 4 0 1 1 8 0 a4 4 0 1 1 -8 0"/>
      <rect x="20" y="20" width="14" height="14" fill="currentColor" opacity="0.1"/>
      <path d="M22 27 L25 30 L33 22" stroke-width="3"/>
    </g>
  </symbol>
  <symbol id="icon-price-tag" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M6 6 L20 6 L34 20 L20 34 L6 20 Z"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      <path d="M22 14 l2 4 l4 1 l-3 3 l1 4 l-4 -2 l-4 2 l1 -4 l-3 -3 l4 -1 z" fill="currentColor"/>
    </g>
  </symbol>
  <symbol id="icon-key" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="20" r="6"/>
      <circle cx="12" cy="20" r="2" fill="currentColor"/>
      <path d="M18 20 H34"/>
      <path d="M28 20 V26"/>
      <path d="M32 20 V24"/>
    </g>
  </symbol>
  <symbol id="icon-doc-history" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 4 H26 L32 10 V36 H8 Z"/>
      <path d="M26 4 V10 H32"/>
      <line x1="12" y1="16" x2="28" y2="16"/>
      <line x1="12" y1="22" x2="28" y2="22"/>
      <line x1="12" y1="28" x2="22" y2="28"/>
    </g>
  </symbol>
  <symbol id="icon-shield-check" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M20 4 L34 10 V20 C34 28 28 34 20 36 C12 34 6 28 6 20 V10 Z"/>
      <path d="M14 20 L18 24 L26 16" stroke-width="3"/>
    </g>
  </symbol>
  <symbol id="icon-handshake" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 20 L12 14 L20 18 L28 14 L36 20"/>
      <path d="M14 22 L20 26 L26 22"/>
      <rect x="6" y="18" width="6" height="10"/>
      <rect x="28" y="18" width="6" height="10"/>
    </g>
  </symbol>
  <symbol id="icon-padlock" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="8" y="18" width="24" height="18"/>
      <path d="M14 18 V12 a6 6 0 0 1 12 0 V18"/>
      <rect x="18" y="24" width="4" height="6" fill="currentColor"/>
      <rect x="28" y="20" width="4" height="4" fill="currentColor" opacity="0.3"/>
    </g>
  </symbol>
  <symbol id="icon-person-star" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="20" cy="14" r="6"/>
      <path d="M8 36 C8 26 12 22 20 22 C28 22 32 26 32 36"/>
      <path d="M28 4 l1 3 l3 1 l-2 2 l1 3 l-3 -2 l-3 2 l1 -3 l-2 -2 l3 -1 z" fill="currentColor"/>
    </g>
  </symbol>
  <symbol id="icon-engine" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="6" y="10" width="20" height="14"/>
      <rect x="2" y="14" width="4" height="6"/>
      <rect x="26" y="14" width="4" height="6"/>
      <line x1="10" y1="6" x2="10" y2="10"/>
      <line x1="16" y1="6" x2="16" y2="10"/>
      <line x1="22" y1="6" x2="22" y2="10"/>
      <rect x="9" y="4" width="14" height="2" fill="currentColor"/>
    </g>
  </symbol>
  <symbol id="icon-fluid" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 4 H20 V8 L24 12 V28 H8 V12 L12 8 Z"/>
      <line x1="14" y1="4" x2="14" y2="2" stroke-width="3"/>
      <line x1="18" y1="4" x2="18" y2="2" stroke-width="3"/>
      <rect x="10" y="20" width="12" height="6" fill="currentColor" opacity="0.4"/>
    </g>
  </symbol>
  <symbol id="icon-undercarriage" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M2 16 H30"/>
      <rect x="6" y="10" width="20" height="6"/>
      <line x1="6" y1="13" x2="26" y2="13"/>
      <circle cx="10" cy="20" r="3"/>
      <circle cx="22" cy="20" r="3"/>
      <line x1="10" y1="16" x2="10" y2="17"/>
      <line x1="22" y1="16" x2="22" y2="17"/>
    </g>
  </symbol>
  <symbol id="icon-camera" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="6" y="18" width="52" height="36"/>
      <path d="M22 18 L26 12 H38 L42 18"/>
      <circle cx="32" cy="36" r="10"/>
      <circle cx="32" cy="36" r="4" fill="currentColor"/>
      <rect x="48" y="22" width="6" height="4" fill="currentColor"/>
    </g>
  </symbol>
  <symbol id="icon-car-top" viewBox="0 0 280 200">
    <g>
      <!-- Top-down sedan -->
      <rect x="80" y="20" width="120" height="160" fill="#2E2E44"/>
      <rect x="90" y="40" width="100" height="40" fill="#0A0A0A"/>
      <rect x="90" y="120" width="100" height="40" fill="#0A0A0A"/>
      <line x1="140" y1="40" x2="140" y2="160" stroke="#1C1C2E" stroke-width="2"/>
      <!-- wheels -->
      <rect x="70" y="40" width="14" height="24" fill="#0A0A0A"/>
      <rect x="196" y="40" width="14" height="24" fill="#0A0A0A"/>
      <rect x="70" y="136" width="14" height="24" fill="#0A0A0A"/>
      <rect x="196" y="136" width="14" height="24" fill="#0A0A0A"/>
      <!-- hotspots -->
      <g font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700">
        <circle cx="140" cy="14" r="10" fill="#00F5FF"/>
        <text x="140" y="18" text-anchor="middle" fill="#0A0A0A">1</text>
        <circle cx="140" cy="186" r="10" fill="#00F5FF"/>
        <text x="140" y="190" text-anchor="middle" fill="#0A0A0A">2</text>
        <circle cx="60" cy="100" r="10" fill="#00F5FF"/>
        <text x="60" y="104" text-anchor="middle" fill="#0A0A0A">3</text>
        <circle cx="220" cy="100" r="10" fill="#00F5FF"/>
        <text x="220" y="104" text-anchor="middle" fill="#0A0A0A">4</text>
      </g>
    </g>
  </symbol>
  <symbol id="icon-reserved-car" viewBox="0 0 320 240">
    <g>
      <!-- Ground -->
      <rect y="200" width="320" height="40" fill="#1C1C2E"/>
      <!-- Body -->
      <rect x="40" y="120" width="240" height="50" fill="#FF2D78"/>
      <rect x="60" y="80" width="200" height="40" fill="#FF2D78"/>
      <rect x="80" y="84" width="60" height="30" fill="#0A0A0A"/>
      <rect x="180" y="84" width="60" height="30" fill="#0A0A0A"/>
      <!-- Wheels -->
      <circle cx="80" cy="180" r="20" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="3"/>
      <circle cx="240" cy="180" r="20" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="3"/>
      <circle cx="80" cy="180" r="6" fill="#E8F0F2"/>
      <circle cx="240" cy="180" r="6" fill="#E8F0F2"/>
      <!-- Headlight -->
      <rect x="40" y="135" width="8" height="10" fill="#AAFF00"/>
      <!-- Reserved placard -->
      <g transform="rotate(-4 220 96)">
        <rect x="180" y="84" width="80" height="24" fill="#CC00FF" stroke="#0A0A0A" stroke-width="2"/>
        <text x="220" y="100" text-anchor="middle" font-family="'Press Start 2P', monospace" font-size="9" fill="#E8F0F2">RESERVED</text>
      </g>
      <!-- Big key -->
      <g transform="translate(20,30)">
        <circle cx="20" cy="20" r="14" fill="none" stroke="#00F5FF" stroke-width="4"/>
        <circle cx="20" cy="20" r="4" fill="#00F5FF"/>
        <rect x="34" y="17" width="36" height="6" fill="#00F5FF"/>
        <rect x="60" y="23" width="6" height="6" fill="#00F5FF"/>
        <rect x="50" y="23" width="4" height="4" fill="#00F5FF"/>
      </g>
    </g>
  </symbol>
  <symbol id="icon-photo-placeholder" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="2">
      <rect x="4" y="10" width="56" height="44"/>
      <circle cx="20" cy="26" r="4" fill="currentColor"/>
      <path d="M4 50 L20 36 L34 46 L46 32 L60 46" stroke-width="3"/>
    </g>
  </symbol>
</svg>
