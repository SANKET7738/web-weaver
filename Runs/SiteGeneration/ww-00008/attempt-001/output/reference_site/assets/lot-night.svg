<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Sky -->
  <rect width="680" height="280" fill="#0A0A0A"/>
  <!-- Stars -->
  <g fill="#E8F0F2">
    <rect x="60" y="40" width="2" height="2"/>
    <rect x="120" y="80" width="2" height="2"/>
    <rect x="220" y="30" width="2" height="2"/>
    <rect x="320" y="60" width="2" height="2"/>
    <rect x="440" y="20" width="2" height="2"/>
    <rect x="520" y="70" width="2" height="2"/>
    <rect x="600" y="50" width="2" height="2"/>
    <rect x="660" y="100" width="2" height="2"/>
    <rect x="80" y="120" width="2" height="2"/>
    <rect x="180" y="150" width="2" height="2"/>
  </g>
  <!-- Moon -->
  <circle cx="540" cy="80" r="36" fill="#1C1C2E"/>
  <circle cx="554" cy="74" r="36" fill="#0A0A0A"/>
  <!-- Ground -->
  <rect y="280" width="680" height="180" fill="#1C1C2E"/>
  <!-- Asphalt grid -->
  <g stroke="#2E2E44" stroke-width="2">
    <line x1="0" y1="320" x2="680" y2="320"/>
    <line x1="0" y1="380" x2="680" y2="380"/>
    <line x1="0" y1="430" x2="680" y2="430"/>
  </g>
  <!-- REVVLOT neon sign -->
  <g>
    <rect x="200" y="120" width="280" height="80" fill="#0A0A0A" stroke="#CC00FF" stroke-width="4"/>
    <text x="340" y="172" fill="#00F5FF" font-family="'Press Start 2P', monospace" font-size="36" text-anchor="middle" style="filter: drop-shadow(0 0 6px #00F5FF);">REVVLOT</text>
    <!-- sign poles -->
    <rect x="208" y="200" width="6" height="80" fill="#2E2E44"/>
    <rect x="466" y="200" width="6" height="80" fill="#2E2E44"/>
  </g>
  <!-- String lights -->
  <g stroke="#AAFF00" stroke-width="1">
    <line x1="0" y1="240" x2="680" y2="220"/>
  </g>
  <g fill="#AAFF00">
    <circle cx="40" cy="237" r="3"/>
    <circle cx="120" cy="234" r="3"/>
    <circle cx="200" cy="231" r="3"/>
    <circle cx="280" cy="228" r="3"/>
    <circle cx="360" cy="225" r="3"/>
    <circle cx="440" cy="222" r="3"/>
    <circle cx="520" cy="220" r="3"/>
    <circle cx="600" cy="217" r="3"/>
  </g>
  <g fill="#FF2D78">
    <circle cx="80" cy="236" r="3"/>
    <circle cx="160" cy="233" r="3"/>
    <circle cx="240" cy="230" r="3"/>
    <circle cx="320" cy="226" r="3"/>
    <circle cx="400" cy="223" r="3"/>
    <circle cx="480" cy="221" r="3"/>
    <circle cx="560" cy="218" r="3"/>
    <circle cx="640" cy="216" r="3"/>
  </g>
  <!-- Cars (pixel art) -->
  <g>
    <!-- Car 1 (red) -->
    <g transform="translate(40,330)">
      <rect x="0" y="14" width="80" height="22" fill="#FF2D78"/>
      <rect x="10" y="0" width="60" height="14" fill="#FF2D78"/>
      <rect x="14" y="2" width="22" height="10" fill="#0A0A0A"/>
      <rect x="44" y="2" width="22" height="10" fill="#0A0A0A"/>
      <circle cx="18" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <circle cx="62" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <rect x="0" y="22" width="6" height="4" fill="#AAFF00"/>
    </g>
    <!-- Car 2 (cyan) -->
    <g transform="translate(160,335)">
      <rect x="0" y="14" width="80" height="22" fill="#00F5FF"/>
      <rect x="10" y="0" width="60" height="14" fill="#00F5FF"/>
      <rect x="14" y="2" width="22" height="10" fill="#0A0A0A"/>
      <rect x="44" y="2" width="22" height="10" fill="#0A0A0A"/>
      <circle cx="18" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <circle cx="62" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <rect x="74" y="22" width="6" height="4" fill="#FF2D78"/>
    </g>
    <!-- Car 3 (yellow/lime) -->
    <g transform="translate(280,330)">
      <rect x="0" y="14" width="80" height="22" fill="#AAFF00"/>
      <rect x="10" y="0" width="60" height="14" fill="#AAFF00"/>
      <rect x="14" y="2" width="22" height="10" fill="#0A0A0A"/>
      <rect x="44" y="2" width="22" height="10" fill="#0A0A0A"/>
      <circle cx="18" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <circle cx="62" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
    </g>
    <!-- Car 4 (purple) -->
    <g transform="translate(400,338)">
      <rect x="0" y="14" width="80" height="22" fill="#CC00FF"/>
      <rect x="10" y="0" width="60" height="14" fill="#CC00FF"/>
      <rect x="14" y="2" width="22" height="10" fill="#0A0A0A"/>
      <rect x="44" y="2" width="22" height="10" fill="#0A0A0A"/>
      <circle cx="18" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <circle cx="62" cy="38" r="6" fill="#0A0A0A" stroke="#E8F0F2" stroke-width="2"/>
      <rect x="0" y="22" width="6" height="4" fill="#AAFF00"/>
    </g>
    <!-- Car 5 (white) -->
    <g transform="translate(520,330)">
      <rect x="0" y="14" width="80" height="22" fill="#E8F0F2"/>
      <rect x="10" y="0" width="60" height="14" fill="#E8F0F2"/>
      <rect x="14" y="2" width="22" height="10" fill="#0A0A0A"/>
      <rect x="44" y="2" width="22" height="10" fill="#0A0A0A"/>
      <circle cx="18" cy="38" r="6" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <circle cx="62" cy="38" r="6" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    </g>
  </g>
  <!-- Horizon glow -->
  <rect y="278" width="680" height="3" fill="#00F5FF" opacity="0.6"/>
</svg>
