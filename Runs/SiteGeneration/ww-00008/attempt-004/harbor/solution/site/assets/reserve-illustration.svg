<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-label="Pixel-art retro car with RESERVED placard and oversized key, item-unlock screen">
  <!-- bg -->
  <rect width="360" height="280" fill="#110022"/>
  <!-- starburst -->
  <g transform="translate(180,140)">
    <g stroke="#FFFF00" stroke-width="2" fill="none">
      <line x1="-130" y1="0" x2="130" y2="0"/>
      <line x1="0" y1="-130" x2="0" y2="130"/>
      <line x1="-92" y1="-92" x2="92" y2="92"/>
      <line x1="-92" y1="92" x2="92" y2="-92"/>
    </g>
    <circle r="100" fill="#330055"/>
    <circle r="100" fill="none" stroke="#FF00CC" stroke-width="3" stroke-dasharray="6 6"/>
  </g>
  <!-- car -->
  <g transform="translate(56, 170)">
    <rect x="0" y="20" width="200" height="48" fill="#00CCFF" stroke="#110022" stroke-width="3"/>
    <polygon points="30,0 170,0 154,20 46,20" fill="#00CCFF" stroke="#110022" stroke-width="3"/>
    <rect x="40" y="4" width="50" height="16" fill="#110022"/>
    <rect x="110" y="4" width="50" height="16" fill="#110022"/>
    <rect x="92" y="4" width="16" height="16" fill="#00CCFF"/>
    <circle cx="44" cy="74" r="14" fill="#110022"/>
    <circle cx="156" cy="74" r="14" fill="#110022"/>
    <circle cx="44" cy="74" r="6" fill="#C0C0C0"/>
    <circle cx="156" cy="74" r="6" fill="#C0C0C0"/>
    <rect x="-8" y="40" width="10" height="12" fill="#FFFF00"/>
    <!-- RESERVED placard -->
    <g transform="translate(36,-10)">
      <rect x="0" y="0" width="128" height="18" fill="#FFFF00" stroke="#110022" stroke-width="2"/>
      <text x="64" y="14" font-family="Arial Black, sans-serif" font-size="13" fill="#110022" text-anchor="middle" letter-spacing="2">RESERVED</text>
    </g>
  </g>
  <!-- oversized key -->
  <g transform="translate(220,40) rotate(-20)">
    <circle cx="20" cy="20" r="22" fill="none" stroke="#FFFF00" stroke-width="6"/>
    <circle cx="20" cy="20" r="8" fill="#110022" stroke="#FFFF00" stroke-width="3"/>
    <rect x="40" y="14" width="80" height="12" fill="#FFFF00"/>
    <rect x="100" y="22" width="10" height="12" fill="#FFFF00"/>
    <rect x="86" y="22" width="6" height="10" fill="#FFFF00"/>
  </g>
  <!-- arm -->
  <g>
    <rect x="280" y="46" width="60" height="22" fill="#E8C8A0" stroke="#110022" stroke-width="2"/>
    <rect x="280" y="68" width="60" height="14" fill="#FF00CC" stroke="#110022" stroke-width="2"/>
  </g>
  <!-- "ITEM UNLOCKED" text bubble -->
  <g transform="translate(28,40)">
    <rect x="0" y="0" width="170" height="30" fill="#00FF33" stroke="#110022" stroke-width="2"/>
    <text x="85" y="22" font-family="VT323, monospace" font-size="20" fill="#110022" text-anchor="middle" letter-spacing="3">★ ITEM UNLOCKED ★</text>
  </g>
</svg>
