<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Top-down pixel-art diagram of a 4-door sedan with numbered photo capture points">
  <!-- background -->
  <rect width="1200" height="320" fill="#110022"/>
  <!-- title -->
  <g font-family="VT323, monospace" fill="#00CCFF">
    <text x="40" y="40" font-size="22" letter-spacing="3">EXTERIOR CAPTURE MAP — 4 ANGLES</text>
  </g>

  <!-- Car body (top-down sedan) -->
  <g transform="translate(360,60)" fill="none" stroke="#FF00CC" stroke-width="4" stroke-linejoin="miter">
    <!-- main outline -->
    <rect x="0" y="40" width="480" height="160"/>
    <!-- hood/trunk separators -->
    <line x1="80" y1="40" x2="80" y2="200"/>
    <line x1="400" y1="40" x2="400" y2="200"/>
    <!-- roof -->
    <rect x="120" y="60" width="240" height="120"/>
    <!-- doors -->
    <line x1="240" y1="60" x2="240" y2="180"/>
    <!-- windshield/rear window -->
    <line x1="120" y1="80" x2="240" y2="80"/>
    <line x1="240" y1="160" x2="360" y2="160"/>
    <!-- mirrors -->
    <rect x="100" y="30" width="20" height="10"/>
    <rect x="100" y="200" width="20" height="10"/>
    <!-- wheels -->
    <rect x="40" y="20" width="40" height="20" fill="#FF00CC"/>
    <rect x="40" y="200" width="40" height="20" fill="#FF00CC"/>
    <rect x="400" y="20" width="40" height="20" fill="#FF00CC"/>
    <rect x="400" y="200" width="40" height="20" fill="#FF00CC"/>
    <!-- headlights -->
    <rect x="0" y="50" width="14" height="20" fill="#FFFF00" stroke="#FFFF00"/>
    <rect x="0" y="170" width="14" height="20" fill="#FFFF00" stroke="#FFFF00"/>
    <!-- taillights -->
    <rect x="466" y="50" width="14" height="20" fill="#FFFF00" stroke="#FF00CC"/>
    <rect x="466" y="170" width="14" height="20" fill="#FFFF00" stroke="#FF00CC"/>
  </g>

  <!-- Hotspot markers -->
  <g font-family="Arial Black, sans-serif" font-size="22" font-weight="bold">
    <!-- Front 3/4 -->
    <circle cx="320" cy="90" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="320" y="98" fill="#110022" text-anchor="middle">1</text>
    <line x1="320" y1="112" x2="372" y2="120" stroke="#00FF33" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Driver side -->
    <circle cx="600" cy="40" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="600" y="48" fill="#110022" text-anchor="middle">2</text>
    <line x1="600" y1="62" x2="600" y2="98" stroke="#00FF33" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Passenger side -->
    <circle cx="600" cy="280" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="600" y="288" fill="#110022" text-anchor="middle">3</text>
    <line x1="600" y1="258" x2="600" y2="222" stroke="#00FF33" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Rear 3/4 -->
    <circle cx="880" cy="230" r="22" fill="#00FF33" stroke="#110022" stroke-width="3"/>
    <text x="880" y="238" fill="#110022" text-anchor="middle">4</text>
    <line x1="858" y1="222" x2="836" y2="200" stroke="#00FF33" stroke-width="2" stroke-dasharray="3 3"/>
  </g>

  <!-- Legend -->
  <g font-family="VT323, monospace" font-size="18" fill="#E8E8E8">
    <text x="40" y="240">[1] FRONT 3/4 VIEW</text>
    <text x="40" y="262">[2] DRIVER SIDE</text>
    <text x="40" y="284">[3] PASSENGER SIDE</text>
    <text x="240" y="240">[4] REAR 3/4 VIEW</text>
  </g>
</svg>
