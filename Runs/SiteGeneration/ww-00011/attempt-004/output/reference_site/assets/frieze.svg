<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44">
  <g stroke="#B8962E" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- top and bottom rule -->
    <line x1="0" y1="6" x2="240" y2="6"/>
    <line x1="0" y1="38" x2="240" y2="38"/>

    <!-- repeating frieze: tennis ball, racket, laurel sprig -->
    <!-- group 1: tennis ball -->
    <circle cx="20" cy="22" r="7"/>
    <path d="M14 18 q6 4 12 0"/>
    <path d="M14 26 q6 -4 12 0"/>

    <!-- racket -->
    <ellipse cx="60" cy="20" rx="6" ry="8"/>
    <line x1="54" y1="20" x2="66" y2="20"/>
    <line x1="60" y1="14" x2="60" y2="28"/>
    <line x1="60" y1="28" x2="60" y2="36"/>

    <!-- laurel sprig -->
    <path d="M90 22 q12 -8 24 0"/>
    <path d="M93 22 q1 -3 4 -3"/>
    <path d="M99 19 q1 -3 4 -3"/>
    <path d="M105 17 q1 -3 4 -3"/>
    <path d="M93 22 q1 3 4 3"/>
    <path d="M99 25 q1 3 4 3"/>
    <path d="M105 27 q1 3 4 3"/>

    <!-- diamond -->
    <path d="M132 14 L138 22 L132 30 L126 22 Z"/>

    <!-- group 2 mirrored -->
    <circle cx="155" cy="22" r="7"/>
    <path d="M149 18 q6 4 12 0"/>
    <path d="M149 26 q6 -4 12 0"/>

    <ellipse cx="195" cy="20" rx="6" ry="8"/>
    <line x1="189" y1="20" x2="201" y2="20"/>
    <line x1="195" y1="14" x2="195" y2="28"/>
    <line x1="195" y1="28" x2="195" y2="36"/>

    <path d="M225 22 q-12 -8 -24 0" transform="translate(0,0)"/>
    <path d="M222 22 q-1 -3 -4 -3"/>
    <path d="M216 19 q-1 -3 -4 -3"/>
    <path d="M210 17 q-1 -3 -4 -3"/>
    <path d="M222 22 q-1 3 -4 3"/>
    <path d="M216 25 q-1 3 -4 3"/>
    <path d="M210 27 q-1 3 -4 3"/>
  </g>
</svg>
