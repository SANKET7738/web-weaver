<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="grain" width="240" height="240" patternUnits="userSpaceOnUse">
      <g stroke="#F5F0E8" stroke-width="0.6" opacity="0.9" fill="none">
        <line x1="0" y1="0" x2="240" y2="240"/>
        <line x1="0" y1="40" x2="200" y2="240"/>
        <line x1="40" y1="0" x2="240" y2="200"/>
        <line x1="0" y1="80" x2="160" y2="240"/>
        <line x1="80" y1="0" x2="240" y2="160"/>
        <line x1="0" y1="120" x2="120" y2="240"/>
        <line x1="120" y1="0" x2="240" y2="120"/>
        <line x1="0" y1="160" x2="80" y2="240"/>
        <line x1="160" y1="0" x2="240" y2="80"/>
      </g>
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#grain)"/>
</svg>
