<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Background -->
  <rect width="1000" height="700" fill="#F5EDDA"/>

  <!-- Border frame -->
  <rect x="30" y="30" width="940" height="640" fill="none" stroke="#2C2118" stroke-width="3"/>
  <rect x="46" y="46" width="908" height="608" fill="none" stroke="#2C2118" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Top crown -->
  <g stroke="#2C2118" stroke-width="2" fill="none">
    <path d="M180 90 Q 500 60 820 90"/>
    <path d="M180 105 Q 500 78 820 105"/>
  </g>
  <text x="500" y="135" font-family="Caveat, cursive" font-size="32" fill="#E8614A" text-anchor="middle">~ presenting ~</text>

  <!-- Major lineup type cascade -->
  <text x="500" y="220" font-family="Fraunces, serif" font-weight="900" font-size="74" fill="#2C2118" text-anchor="middle">INKWELL</text>
  <text x="500" y="290" font-family="Fraunces, serif" font-weight="900" font-size="74" fill="#E8614A" text-anchor="middle">JAZZ FESTIVAL</text>

  <!-- Ornament -->
  <g stroke="#2C2118" stroke-width="2" fill="none">
    <path d="M280 320 Q 500 300 720 320"/>
    <circle cx="500" cy="310" r="6" fill="#D4A72C"/>
  </g>

  <!-- Artist list -->
  <g font-family="Fraunces, serif" text-anchor="middle">
    <text x="500" y="365" font-weight="800" font-size="40" fill="#2C2118">MARLENA VOSS QUARTET</text>
    <text x="500" y="408" font-weight="700" font-size="32" fill="#5C3460">THE COLTRANE COLLECTIVE</text>
    <text x="500" y="448" font-weight="800" font-size="36" fill="#2C2118">ESPERANZA BLUE</text>
  </g>

  <!-- Decorative star -->
  <g fill="#D4A72C" stroke="#2C2118" stroke-width="1.5">
    <path d="M500 478 L 506 494 L 524 494 L 510 506 L 516 522 L 500 512 L 484 522 L 490 506 L 476 494 L 494 494 Z"/>
  </g>

  <!-- Supporting list -->
  <g font-family="Fraunces, serif" text-anchor="middle" fill="#2C2118">
    <text x="500" y="555" font-weight="700" font-size="22">Theo Adkins Trio · Sable &amp; the Horns</text>
    <text x="500" y="582" font-weight="700" font-size="22">Nora Kimani · Riverside Collective</text>
    <text x="500" y="615" font-family="Caveat, cursive" font-size="26" fill="#6B7A3A">+ forty more across three stages</text>
  </g>

  <!-- Date footer -->
  <g stroke="#2C2118" stroke-width="2" fill="none">
    <path d="M280 645 Q 500 625 720 645"/>
  </g>
  <text x="500" y="668" font-family="Caveat, cursive" font-size="22" fill="#2C2118" text-anchor="middle">JULY 18-20  ·  RIVERSIDE MEADOWS</text>

  <!-- Corner flourishes -->
  <g stroke="#E8614A" stroke-width="2.5" fill="none">
    <path d="M60 60 Q 80 80 75 110"/>
    <path d="M940 60 Q 920 80 925 110"/>
    <path d="M60 640 Q 80 620 75 590"/>
    <path d="M940 640 Q 920 620 925 590"/>
  </g>

  <!-- Ink splatters -->
  <g fill="#2C2118">
    <circle cx="120" cy="380" r="3"/>
    <circle cx="135" cy="395" r="1.5"/>
    <circle cx="880" cy="220" r="3"/>
    <circle cx="870" cy="240" r="1.5"/>
    <circle cx="200" cy="160" r="2"/>
  </g>
</svg>
