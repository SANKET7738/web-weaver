<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" aria-hidden="true">
  <!-- Parchment background -->
  <rect x="20" y="20" width="960" height="580" rx="8" fill="#F5EDDA" stroke="#2C2118" stroke-width="2"/>
  <!-- Texture cross-hatching for paper feel -->
  <g stroke="#C8BEA8" stroke-width="0.6" opacity="0.5">
    <path d="M20 60 L 980 60"/>
    <path d="M20 100 L 980 100"/>
    <path d="M20 140 L 980 140"/>
    <path d="M20 180 L 980 180"/>
    <path d="M20 220 L 980 220"/>
    <path d="M20 260 L 980 260"/>
    <path d="M20 300 L 980 300"/>
    <path d="M20 340 L 980 340"/>
    <path d="M20 380 L 980 380"/>
    <path d="M20 420 L 980 420"/>
    <path d="M20 460 L 980 460"/>
    <path d="M20 500 L 980 500"/>
    <path d="M20 540 L 980 540"/>
  </g>

  <!-- River meandering -->
  <path d="M30 480 Q 200 460 350 490 Q 500 520 700 480 Q 850 450 980 470" stroke="#7BBFD4" stroke-width="22" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M30 480 Q 200 460 350 490 Q 500 520 700 480 Q 850 450 980 470" stroke="#2C2118" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
  <text x="560" y="535" font-family="Caveat, cursive" font-size="20" fill="#2C2118" text-anchor="middle">~ the river ~</text>

  <!-- Trees/foliage scattered -->
  <g fill="#6B7A3A" stroke="#2C2118" stroke-width="1.5">
    <circle cx="80" cy="120" r="14"/>
    <circle cx="120" cy="100" r="11"/>
    <circle cx="150" cy="140" r="13"/>
    <circle cx="900" cy="120" r="13"/>
    <circle cx="940" cy="150" r="11"/>
    <circle cx="60" cy="320" r="11"/>
    <circle cx="95" cy="345" r="13"/>
    <circle cx="930" cy="320" r="14"/>
    <circle cx="900" cy="350" r="11"/>
  </g>

  <!-- Pathways - dashed -->
  <g stroke="#2C2118" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M220 90 Q 320 200 460 220 Q 600 240 720 200"/>
    <path d="M460 220 Q 440 320 380 400"/>
    <path d="M460 220 Q 540 320 620 400"/>
  </g>

  <!-- Main Stage (large) -->
  <g>
    <path d="M620 130 Q 760 110 840 160 Q 870 210 800 250 Q 700 270 620 240 Q 580 200 620 130 Z" fill="#E8614A" stroke="#2C2118" stroke-width="2.5"/>
    <text x="730" y="185" font-family="Fraunces, serif" font-weight="800" font-size="22" fill="#F5EDDA" text-anchor="middle">MAIN</text>
    <text x="730" y="212" font-family="Fraunces, serif" font-weight="800" font-size="22" fill="#F5EDDA" text-anchor="middle">STAGE</text>
    <text data-map-label x="720" y="275" font-family="Caveat, cursive" font-size="18" fill="#2C2118" text-anchor="middle" opacity="0">★ Friday · Saturday · Sunday</text>
  </g>

  <!-- Inkwell Tent -->
  <g>
    <path d="M250 80 L 320 80 L 340 150 L 230 150 Z" fill="#5C3460" stroke="#2C2118" stroke-width="2.5"/>
    <path d="M250 80 L 285 50 L 320 80" fill="#D4A72C" stroke="#2C2118" stroke-width="2.5"/>
    <text data-map-label x="285" y="180" font-family="Caveat, cursive" font-size="18" fill="#2C2118" text-anchor="middle" opacity="0">Inkwell Tent</text>
  </g>

  <!-- Sketch Stage -->
  <g>
    <path d="M150 280 Q 220 260 280 290 Q 295 330 240 350 Q 170 360 140 320 Z" fill="#D4A72C" stroke="#2C2118" stroke-width="2.5"/>
    <text x="215" y="320" font-family="Fraunces, serif" font-weight="800" font-size="16" fill="#2C2118" text-anchor="middle">SKETCH</text>
    <text x="215" y="338" font-family="Fraunces, serif" font-weight="800" font-size="16" fill="#2C2118" text-anchor="middle">STAGE</text>
    <text data-map-label x="220" y="385" font-family="Caveat, cursive" font-size="18" fill="#2C2118" text-anchor="middle" opacity="0">Acoustic daytime</text>
  </g>

  <!-- Food Village -->
  <g>
    <g fill="#6B7A3A" stroke="#2C2118" stroke-width="2">
      <rect x="400" y="280" width="48" height="40" rx="3"/>
      <rect x="455" y="290" width="40" height="35" rx="3"/>
      <rect x="500" y="280" width="48" height="42" rx="3"/>
    </g>
    <path d="M400 278 L 412 268 L 448 268 L 448 280 Z" fill="#E8614A" stroke="#2C2118" stroke-width="2"/>
    <path d="M455 288 L 475 278 L 495 290 Z" fill="#D4A72C" stroke="#2C2118" stroke-width="2"/>
    <path d="M500 278 L 524 268 L 548 280 Z" fill="#E8614A" stroke="#2C2118" stroke-width="2"/>
    <text data-map-label x="475" y="350" font-family="Caveat, cursive" font-size="18" fill="#2C2118" text-anchor="middle" opacity="0">Food Village &amp; Bars</text>
  </g>

  <!-- Illustration Market -->
  <g>
    <rect x="600" y="320" width="120" height="55" rx="4" fill="#F5EDDA" stroke="#2C2118" stroke-width="2.5"/>
    <line x1="620" y1="320" x2="620" y2="375" stroke="#2C2118" stroke-width="1.5"/>
    <line x1="660" y1="320" x2="660" y2="375" stroke="#2C2118" stroke-width="1.5"/>
    <line x1="700" y1="320" x2="700" y2="375" stroke="#2C2118" stroke-width="1.5"/>
    <text x="660" y="354" font-family="Caveat, cursive" font-size="15" fill="#2C2118" text-anchor="middle">Illustration Market</text>
    <text data-map-label x="660" y="395" font-family="Caveat, cursive" font-size="16" fill="#2C2118" text-anchor="middle" opacity="0">Prints &amp; vinyl</text>
  </g>

  <!-- Workshop Tents -->
  <g>
    <path d="M130 200 L 180 200 L 195 250 L 115 250 Z" fill="#7BBFD4" stroke="#2C2118" stroke-width="2"/>
    <path d="M130 200 L 155 175 L 180 200" fill="#6B7A3A" stroke="#2C2118" stroke-width="2"/>
    <text data-map-label x="155" y="275" font-family="Caveat, cursive" font-size="16" fill="#2C2118" text-anchor="middle" opacity="0">Workshop Tents</text>
  </g>

  <!-- Main Entrance -->
  <g>
    <rect x="50" y="60" width="120" height="40" rx="4" fill="#F5EDDA" stroke="#2C2118" stroke-width="2.5"/>
    <text x="110" y="86" font-family="Fraunces, serif" font-weight="700" font-size="15" fill="#2C2118" text-anchor="middle">GATE A</text>
    <text data-map-label x="110" y="50" font-family="Caveat, cursive" font-size="18" fill="#E8614A" text-anchor="middle" opacity="0">↓ start here</text>
    <!-- Arrow indicator -->
    <path d="M110 105 L 110 130 L 105 124 M 110 130 L 115 124" stroke="#2C2118" stroke-width="2" fill="none"/>
  </g>

  <!-- First Aid -->
  <g>
    <rect x="800" y="320" width="60" height="40" rx="4" fill="#F5EDDA" stroke="#E8614A" stroke-width="2.5"/>
    <path d="M822 332 h 16 M 830 326 v 16" stroke="#E8614A" stroke-width="3"/>
    <text data-map-label x="830" y="378" font-family="Caveat, cursive" font-size="15" fill="#2C2118" text-anchor="middle" opacity="0">First Aid</text>
  </g>

  <!-- Accessibility route -->
  <path d="M170 100 Q 250 200 460 220" stroke="#7BBFD4" stroke-width="6" fill="none" opacity="0.6" stroke-dasharray="2 4"/>

  <!-- Title scroll -->
  <g>
    <path d="M60 40 L 940 40 L 935 55 L 65 55 Z" fill="#F5EDDA" stroke="#2C2118" stroke-width="1.5"/>
    <text x="500" y="52" font-family="Fraunces, serif" font-weight="900" font-size="14" fill="#2C2118" text-anchor="middle">~ RIVERSIDE MEADOWS · INKWELL JAZZ FESTIVAL 2025 ~</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(60 565)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#2C2118" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#2C2118" stroke-width="2"/>
    <line x1="40" y1="-4" x2="40" y2="4" stroke="#2C2118" stroke-width="2"/>
    <line x1="80" y1="-4" x2="80" y2="4" stroke="#2C2118" stroke-width="2"/>
    <text x="40" y="20" font-family="Caveat, cursive" font-size="14" fill="#2C2118" text-anchor="middle">200 m</text>
  </g>
</svg>
