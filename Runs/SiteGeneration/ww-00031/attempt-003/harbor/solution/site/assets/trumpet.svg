<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none" aria-hidden="true">
  <!-- Loose ink-style trumpet with musical notes -->
  <g stroke="#2C2118" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bell of trumpet -->
    <path d="M70 240 Q40 250 30 290 Q20 330 50 360 Q80 388 130 380 Q160 374 175 350 L175 280 Q170 245 140 235 Q105 226 70 240 Z" fill="#E8614A"/>
    <!-- Inner bell highlight -->
    <path d="M85 280 Q70 295 70 330 Q70 360 100 365 Q130 370 145 345 L145 305 Q140 285 120 280 Q102 277 85 280Z" fill="#F5EDDA" opacity="0.55"/>
    <!-- Tubing -->
    <path d="M175 285 Q255 270 320 270 L420 270 Q455 270 470 280" stroke-width="20" fill="none" stroke="#2C2118"/>
    <path d="M175 320 Q260 320 320 320 L405 320 Q440 320 455 330" stroke-width="20" fill="none" stroke="#2C2118"/>
    <!-- Valves -->
    <rect x="285" y="190" width="22" height="100" rx="4" fill="#D4A72C"/>
    <rect x="325" y="190" width="22" height="100" rx="4" fill="#D4A72C"/>
    <rect x="365" y="190" width="22" height="100" rx="4" fill="#D4A72C"/>
    <line x1="296" y1="170" x2="296" y2="190"/>
    <line x1="336" y1="170" x2="336" y2="190"/>
    <line x1="376" y1="170" x2="376" y2="190"/>
    <circle cx="296" cy="165" r="6" fill="#E8614A"/>
    <circle cx="336" cy="165" r="6" fill="#E8614A"/>
    <circle cx="376" cy="165" r="6" fill="#E8614A"/>
    <!-- Mouthpiece end -->
    <path d="M470 270 Q510 280 530 305 L550 320 Q565 332 570 350" stroke-width="14" fill="none"/>
    <circle cx="568" cy="356" r="14" fill="#F5EDDA"/>
    <!-- Curve back -->
    <path d="M455 325 Q495 340 510 360 Q525 380 525 405" stroke-width="14" fill="none"/>
    <path d="M525 405 Q524 432 502 442 Q478 452 460 432" stroke-width="14" fill="none"/>
    <!-- Floating notes -->
    <g stroke="#2C2118" stroke-width="2.5">
      <ellipse cx="50" cy="80" rx="14" ry="10" transform="rotate(-20 50 80)" fill="#2C2118"/>
      <line x1="63" y1="78" x2="63" y2="30" stroke-width="3"/>
      <path d="M63 30 Q80 38 84 60" fill="none"/>
    </g>
    <g stroke="#2C2118" stroke-width="2.5">
      <ellipse cx="180" cy="55" rx="10" ry="7" transform="rotate(-15 180 55)" fill="#2C2118"/>
      <line x1="189" y1="54" x2="189" y2="20" stroke-width="2.5"/>
    </g>
    <g stroke="#2C2118" stroke-width="2.5">
      <ellipse cx="290" cy="100" rx="12" ry="9" transform="rotate(-10 290 100)" fill="#2C2118"/>
      <line x1="301" y1="98" x2="301" y2="40" stroke-width="3"/>
      <path d="M301 40 C 320 48, 322 70, 305 78" fill="none"/>
    </g>
    <g stroke="#2C2118" stroke-width="2.5">
      <ellipse cx="430" cy="75" rx="11" ry="8" transform="rotate(-25 430 75)" fill="#2C2118"/>
      <line x1="441" y1="71" x2="441" y2="30" stroke-width="3"/>
    </g>
    <!-- Ink splash droplets -->
    <circle cx="20" cy="430" r="6" fill="#E8614A" stroke="none"/>
    <circle cx="40" cy="455" r="3" fill="#E8614A" stroke="none"/>
    <circle cx="500" cy="500" r="5" fill="#D4A72C" stroke="none"/>
    <circle cx="475" cy="475" r="3" fill="#D4A72C" stroke="none"/>
  </g>
</svg>
