[project]
name = "web-weaver"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "beautifulsoup4>=4.14.3",
    "colormath>=3.0.0",
    "lpips>=0.1.4",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=4.13.0.92",
    "piq>=0.8.0",
    "playwright>=1.59.0",
    "pydantic>=2.13.4",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.2",
    "scikit-image>=0.26.0",
    "typer>=0.25.1",
]

[project.scripts]
web-weaver = "web_weaver:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
